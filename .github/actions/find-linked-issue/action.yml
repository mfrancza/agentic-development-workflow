name: 'Find Linked Issue'
description: >
  Reads a PR body and outputs the issue number parsed from a "Closes #N"
  reference. Returns proceed=false when no such reference is found.

inputs:
  token:
    description: >
      GitHub token with pull-requests:read on the repository.
    required: true
  repository:
    description: 'Repository in owner/repo format; call sites pass github.repository.'
    required: true
  pr-number:
    description: 'Pull request number to inspect.'
    required: true

outputs:
  proceed:
    description: '"true" if a Closes #N reference was found; "false" to skip.'
    value: ${{ steps.run.outputs.proceed }}
  issue_number:
    description: 'The issue number referenced by "Closes #N" (only set when proceed=true).'
    value: ${{ steps.run.outputs.issue_number }}

runs:
  using: composite
  steps:
    # setup-node's cache-dependency-path is a glob resolved by @actions/glob,
    # which rejects '.' / '..' path segments, so the action-relative scripts
    # path must be normalized to an absolute path before it is used there.
    - name: Resolve scripts directory
      id: scripts-dir
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        echo "dir=$(cd "$ACTION_PATH/../../scripts" && pwd)" >> "$GITHUB_OUTPUT"
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ steps.scripts-dir.outputs.dir }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      run: npm ci

    - name: Find linked issue
      id: run
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
      run: npx --no-install tsx src/find-linked-issue.ts
