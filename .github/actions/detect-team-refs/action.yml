name: Detect team references
description: Reports whether a JSON array contains org/team references.
inputs:
  assignees:
    description: JSON array of assignee logins and optional org/team references.
    required: false
outputs:
  assignees_has_team:
    description: Whether assignees contains an entry with a slash.
    value: ${{ steps.detect.outputs.assignees_has_team }}
runs:
  using: composite
  steps:
    - name: Resolve scripts directory
      id: scripts-dir
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        scripts_dir="$(cd "$ACTION_PATH/../../scripts" && pwd)"
        echo "dir=${scripts_dir}" >> "$GITHUB_OUTPUT"
        # Enable npm caching only when the lockfile is inside GITHUB_WORKSPACE.
        # setup-node uses @actions/glob, which cannot find files outside the
        # workspace. When this action is referenced remotely (uses: owner/repo/
        # .../action@ref), github.action_path resolves to the runner _actions
        # cache outside GITHUB_WORKSPACE, causing the cache step to fail.
        if [[ "${scripts_dir}" == "${GITHUB_WORKSPACE}"* ]]; then
          echo "cache-key-path=${scripts_dir}/package-lock.json" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ steps.scripts-dir.outputs.cache-key-path }}
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path == ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      run: npm ci
    - id: detect
      name: Detect team references
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      env:
        INPUT_ASSIGNEES: ${{ inputs.assignees }}
      run: npx --no-install tsx src/detect-team-refs.ts
