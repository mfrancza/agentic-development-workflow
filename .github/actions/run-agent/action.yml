name: 'Run agent container'
description: >
  Pulls or builds the agent Docker image and runs the container with the
  standard set of environment variables (GH_TOKEN, ANTHROPIC_API_KEY,
  OPENAI_API_KEY, GITHUB_REPO, AGENT_MODEL) and any optional per-workflow
  identifiers (AGENT_ACTION, GITHUB_ISSUE_NUMBER, GITHUB_PR_NUMBER,
  GITHUB_RUN_ID, ESCALATION_ASSIGNEE, RESOLVE_THREADS_FILE, ADMIN_ASSIGNEES,
  CODE_REVIEWERS). Also creates and mounts an output directory when
  output-dir and output-mount are supplied (used by agent-review for the
  RESOLVE_THREADS_FILE hand-off).
  Pull mode (image non-empty): pulls the specified image and skips the build.
  Build mode (image empty, default): builds from build-context.

inputs:
  image:
    description: >
      Pre-built image reference to pull and run (e.g.
      ghcr.io/mfrancza/agentic-development-workflow/developer:v1). When
      non-empty the build step is skipped and this image is pulled and run
      directly. Leave empty (default) to build from build-context instead.
    required: false
    default: ''
  build-context:
    description: >
      Docker build context directory. Ignored when image is set. When empty
      (default), resolves to the docker/ directory of this action's own
      checkout via github.action_path — correct both for workflows that check
      out the repo at the workspace root and for migrated reusables that
      self-checkout into _agentic-workflow/ (issue #498 design). Pass an
      explicit path only for non-default contexts (e.g. the reviewer image:
      './docker/reviewer' pre-migration, '_agentic-workflow/docker/reviewer'
      after a reusable migrates to self-checkout).
    required: false
    default: ''
  image-tag:
    description: 'Docker image tag used when building from build-context (e.g. agent-developer:ci). Ignored when image is set.'
    required: false
    default: 'agent-developer:ci'
  gh-token:
    description: 'GitHub token injected as GH_TOKEN'
    required: true
  anthropic-api-key:
    description: 'Anthropic API key injected as ANTHROPIC_API_KEY'
    required: true
  openai-api-key:
    description: 'OpenAI API key injected as OPENAI_API_KEY'
    required: true
  xai-api-key:
    description: 'xAI API key injected as XAI_API_KEY'
    required: true
  repo:
    description: 'GitHub repository (owner/name) injected as GITHUB_REPO'
    required: true
  agent-action:
    description: >
      AGENT_ACTION value; omit for workflows that have no action dispatch
      table (e.g. agent-review, which has a dedicated entrypoint).
    required: false
    default: ''
  model:
    description: 'Claude model name injected as AGENT_MODEL'
    required: true
  issue-number:
    description: 'Issue number injected as GITHUB_ISSUE_NUMBER; omit when not applicable'
    required: false
    default: ''
  pr-number:
    description: 'PR number injected as GITHUB_PR_NUMBER; omit when not applicable'
    required: false
    default: ''
  run-id:
    description: 'Workflow run ID injected as GITHUB_RUN_ID; omit when not applicable'
    required: false
    default: ''
  escalation-assignee:
    description: >
      Escalation assignee login injected as ESCALATION_ASSIGNEE; omit when
      not applicable (agent-resolve-conflicts only).
    required: false
    default: ''
  output-dir:
    # NOTE: never write a template expression (dollar-brace syntax) in this
    # metadata section — the runner template-evaluates action.yml at manifest
    # load, and an unrecognized named-value there (e.g. runner.temp, which is
    # step-scope only) makes every workflow using this action fail before any
    # step runs. CI lints for this.
    description: >
      Host directory to create and volume-mount into the container; call
      sites pass the workflow's runner.temp path suffixed with a
      subdirectory (e.g. "reviewer-output"). Must be supplied together with
      output-mount; omit both for workflows that do not need an output
      volume (all developer-agent workflows).
    required: false
    default: ''
  output-mount:
    description: >
      Container path for the output volume (e.g. /agent-output); used
      together with output-dir.
    required: false
    default: ''
  resolve-threads-file:
    description: >
      Container path injected as RESOLVE_THREADS_FILE; omit when not
      applicable (agent-review only).
    required: false
    default: ''
  logs-dir:
    description: >
      Host path of the log directory to bind-mount at /home/agent/logs inside
      the container. The caller is responsible for creating this directory and
      setting chmod 0777 before invoking this action — only the bind-mount is
      wired here.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Pull mode: an external image reference was supplied — skip the build and
    # pull the pre-built image from the registry instead.
    - name: Pull agent image
      if: ${{ inputs.image != '' }}
      shell: bash
      env:
        _IMAGE: ${{ inputs.image }}
      run: docker pull "${_IMAGE}"

    # Build mode: no pre-built image — build from the local source tree.
    - name: Build agent image
      if: ${{ inputs.image == '' }}
      shell: bash
      env:
        _BUILD_CONTEXT: ${{ inputs.build-context }}
        _IMAGE_TAG: ${{ inputs.image-tag }}
        _ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        ctx="${_BUILD_CONTEXT}"
        # Default: the docker/ tree of this action's own checkout. Resolving
        # via action_path keeps build mode working regardless of where the
        # action tree was checked out (workspace root, or _agentic-workflow/
        # after the issue #498 self-checkout migration).
        if [ -z "${ctx}" ]; then
          ctx="$(cd "${_ACTION_PATH}/../../.." && pwd)/docker"
        fi
        docker build -t "${_IMAGE_TAG}" "${ctx}"

    - name: Run agent
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        XAI_API_KEY: ${{ inputs.xai-api-key }}
        GITHUB_REPO: ${{ inputs.repo }}
        AGENT_MODEL: ${{ inputs.model }}
        _IMAGE: ${{ inputs.image }}
        _AGENT_ACTION: ${{ inputs.agent-action }}
        _GITHUB_ISSUE_NUMBER: ${{ inputs.issue-number }}
        _GITHUB_PR_NUMBER: ${{ inputs.pr-number }}
        _GITHUB_RUN_ID: ${{ inputs.run-id }}
        _ESCALATION_ASSIGNEE: ${{ inputs.escalation-assignee }}
        _OUTPUT_DIR: ${{ inputs.output-dir }}
        _OUTPUT_MOUNT: ${{ inputs.output-mount }}
        _RESOLVE_THREADS_FILE: ${{ inputs.resolve-threads-file }}
        _LOGS_DIR: ${{ inputs.logs-dir }}
        _IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail

        # Determine effective image: use the pre-built image when supplied (pull
        # mode), otherwise use the locally-built tag (build mode).
        _EFFECTIVE_IMAGE="${_IMAGE:-${_IMAGE_TAG}}"

        # Build optional -e flags for per-workflow identifiers that are only
        # present on some workflows. Each is included only when non-empty so
        # that the container's env does not receive spurious empty variables.
        _opt_env=()
        [[ -n "${_AGENT_ACTION}" ]] && _opt_env+=(-e AGENT_ACTION="${_AGENT_ACTION}")
        [[ -n "${_GITHUB_ISSUE_NUMBER}" ]] && _opt_env+=(-e GITHUB_ISSUE_NUMBER="${_GITHUB_ISSUE_NUMBER}")
        [[ -n "${_GITHUB_PR_NUMBER}" ]] && _opt_env+=(-e GITHUB_PR_NUMBER="${_GITHUB_PR_NUMBER}")
        [[ -n "${_GITHUB_RUN_ID}" ]] && _opt_env+=(-e GITHUB_RUN_ID="${_GITHUB_RUN_ID}")
        [[ -n "${_ESCALATION_ASSIGNEE}" ]] && _opt_env+=(-e ESCALATION_ASSIGNEE="${_ESCALATION_ASSIGNEE}")
        [[ -n "${_RESOLVE_THREADS_FILE}" ]] && _opt_env+=(-e RESOLVE_THREADS_FILE="${_RESOLVE_THREADS_FILE}")
        # Caller-supplied env vars forwarded from the step's env: block; present
        # only on specific workflows (ADMIN_ASSIGNEES on agent-groom,
        # CODE_REVIEWERS on agent-implement) — omit when unset to keep the
        # container env clean.
        [[ -n "${ADMIN_ASSIGNEES:-}" ]] && _opt_env+=(-e ADMIN_ASSIGNEES="${ADMIN_ASSIGNEES}")
        [[ -n "${CODE_REVIEWERS:-}" ]] && _opt_env+=(-e CODE_REVIEWERS="${CODE_REVIEWERS}")

        # Create and prepare the host output directory if requested; build the
        # volume mount flag. chmod 777 is required because the container's
        # non-root `agent` user does not necessarily share the runner's uid.
        _vol_args=()
        if [[ -n "${_OUTPUT_DIR}" && -n "${_OUTPUT_MOUNT}" ]]; then
          mkdir -p "${_OUTPUT_DIR}"
          chmod 777 "${_OUTPUT_DIR}"
          _vol_args+=(-v "${_OUTPUT_DIR}:${_OUTPUT_MOUNT}")
        fi

        # Bind-mount the log directory when the caller has pre-created it.
        [[ -n "${_LOGS_DIR}" ]] && _vol_args+=(-v "${_LOGS_DIR}:/home/agent/logs")

        docker run --rm \
          -e GH_TOKEN \
          -e ANTHROPIC_API_KEY \
          -e OPENAI_API_KEY \
          -e XAI_API_KEY \
          -e GITHUB_REPO \
          -e AGENT_MODEL \
          "${_opt_env[@]}" \
          "${_vol_args[@]}" \
          "${_EFFECTIVE_IMAGE}"
