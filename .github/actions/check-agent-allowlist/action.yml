name: Check agent allowlist
description: Fail-closed authorization gate for agent-triggering identities.
inputs:
  allowlist:
    description: 'JSON array of AGENT_ALLOWLIST entries (logins and org/team-slug references). Composite actions cannot read the vars context, so the calling workflow passes vars.AGENT_ALLOWLIST here.'
    required: false
    default: ''
  principal:
    description: Login to authorize.
    required: true
  additional-trusted-logins:
    description: JSON array of known trusted logins.
    required: false
    default: '[]'
  skip-gate:
    description: Intentionally skip this event's sender gate.
    required: false
    default: 'false'
  resolver-token:
    description: Token used only when AGENT_ALLOWLIST contains team references.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Resolve scripts directory
      id: scripts-dir
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        scripts_dir="$(cd "$ACTION_PATH/../../scripts" && pwd)"
        echo "dir=${scripts_dir}" >> "$GITHUB_OUTPUT"
        # Enable npm caching only when the lockfile is inside GITHUB_WORKSPACE.
        # setup-node uses @actions/glob, which cannot find files outside the
        # workspace. When this action is referenced remotely (uses: owner/repo/
        # .../action@ref), github.action_path resolves to the runner _actions
        # cache outside GITHUB_WORKSPACE, causing the cache step to fail.
        if [[ "${scripts_dir}" == "${GITHUB_WORKSPACE}"* ]]; then
          echo "cache-key-path=${scripts_dir}/package-lock.json" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ steps.scripts-dir.outputs.cache-key-path }}
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path == ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      run: |
        set -euo pipefail
        npm ci
    - name: Check agent allowlist
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      env:
        INPUT_PRINCIPAL: ${{ inputs.principal }}
        INPUT_ADDITIONAL_TRUSTED_LOGINS: ${{ inputs.additional-trusted-logins }}
        INPUT_SKIP_GATE: ${{ inputs.skip-gate }}
        INPUT_RESOLVER_TOKEN: ${{ inputs.resolver-token }}
        INPUT_ALLOWLIST: ${{ inputs.allowlist }}
      run: |
        set -euo pipefail
        npx --no-install tsx src/check-agent-allowlist.ts
