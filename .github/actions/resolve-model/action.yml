name: 'Resolve model'
description: >
  Resolves a model:* label on a GitHub issue or PR to a Claude model name,
  failing loudly if more than one model:* label is present, and falling back
  to a caller-supplied default when none is found. Output contract: claude_model.
inputs:
  token:
    description: 'GitHub token with read access to the issue or PR'
    required: true
  subject-type:
    description: 'Type of GitHub object to inspect: "issue" or "pr"'
    required: true
  subject-number:
    description: 'Issue or PR number'
    required: true
  repo:
    description: 'Repository in owner/name format (e.g. "octocat/hello-world")'
    required: true
  default-model:
    description: 'Model name to use when no model:* label is present'
    required: true
outputs:
  claude_model:
    description: 'Resolved Claude model name (e.g. "sonnet", "opus", "haiku")'
    value: ${{ steps.run.outputs.claude_model }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: .github/scripts/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: .github/scripts
      run: npm ci

    - name: Resolve model
      id: run
      shell: bash
      working-directory: .github/scripts
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_SUBJECT-TYPE: ${{ inputs.subject-type }}
        INPUT_SUBJECT-NUMBER: ${{ inputs.subject-number }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_DEFAULT-MODEL: ${{ inputs.default-model }}
      run: npx --no-install tsx src/resolve-model.ts
