name: 'Dismiss stale reviewer-bot CHANGES_REQUESTED reviews'
description: >
  Dismisses any prior CHANGES_REQUESTED reviews on the PR that were authored by
  the reviewer bot itself and posted against an earlier head SHA, so that a
  clean re-review pass is not biased by a stale blocking verdict. Paginates
  through all reviews (100 per page), filters to those with state
  CHANGES_REQUESTED authored by the reviewer-app identity (derived at runtime
  via viewer.login) whose commit_id differs from the required head-sha input,
  and issues a dismissal for each. Reviews on the current head SHA are
  preserved so that concurrent sibling matrix legs (all sharing one bot
  identity) do not discard each other's just-posted verdicts.
  Fail-open: individual dismissal errors are logged as warnings and do not fail
  the workflow. See docs/design/reviewer-supersede-stale-verdict.md Decisions
  2, 4, and 5.

inputs:
  token:
    description: >
      Reviewer-app installation token. Used both to derive the reviewer bot
      login (viewer.login GraphQL query) and to issue the dismissal API calls.
    required: true
  repo:
    description: 'Repository in owner/name format'
    required: true
  pr-number:
    description: 'Pull request number'
    required: true
  head-sha:
    description: >
      The current head SHA of the pull request. Only CHANGES_REQUESTED reviews
      whose commit_id differs from this SHA are dismissed; reviews posted against
      the current head SHA (e.g. by a sibling matrix leg) are preserved.
    required: true

runs:
  using: composite
  steps:
    # setup-node's cache-dependency-path is a glob resolved by @actions/glob,
    # which rejects '.' / '..' path segments, so the action-relative scripts
    # path must be normalized to an absolute path before it is used there.
    - name: Resolve scripts directory
      id: scripts-dir
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        scripts_dir="$(cd "$ACTION_PATH/../../scripts" && pwd)"
        echo "dir=${scripts_dir}" >> "$GITHUB_OUTPUT"
        # Enable npm caching only when the lockfile is inside GITHUB_WORKSPACE.
        # setup-node uses @actions/glob, which cannot find files outside the
        # workspace. When this action is referenced remotely (uses: owner/repo/
        # .../action@ref), github.action_path resolves to the runner _actions
        # cache outside GITHUB_WORKSPACE, causing the cache step to fail.
        if [[ "${scripts_dir}" == "${GITHUB_WORKSPACE}"* ]]; then
          echo "cache-key-path=${scripts_dir}/package-lock.json" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ steps.scripts-dir.outputs.cache-key-path }}
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path == ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      run: npm ci

    - name: Dismiss stale reviewer-bot reviews
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
      run: npx --no-install tsx src/dismiss-stale-reviewer-reviews.ts
