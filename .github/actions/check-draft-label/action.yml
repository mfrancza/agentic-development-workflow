name: 'Check draft label'
description: >
  Check whether a GitHub issue carries the "draft" label.
  Sets skip=true when the label is present, indicating that the design PR has
  not yet merged and the developer agent must not run.

inputs:
  token:
    description: 'GitHub token with issue read access'
    required: true
  repo:
    description: 'Repository in "owner/name" format (e.g. github.repository)'
    required: true
  issue-number:
    description: 'Issue number to inspect'
    required: true

outputs:
  skip:
    description: '"true" if the issue has the "draft" label, "false" otherwise'
    value: ${{ steps.run.outputs.skip }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: .github/scripts/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: .github/scripts
      run: npm ci

    - name: Check draft label
      id: run
      shell: bash
      working-directory: .github/scripts
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue-number }}
      run: npx --no-install tsx src/check-draft-label.ts
