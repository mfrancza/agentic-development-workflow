name: 'Find failing agent PRs'
description: >
  Finds open developer-agent PRs with an allowed actionable check failure,
  excluding PRs escalated to human-required.

inputs:
  token:
    description: 'GitHub token with pull-requests: read and checks: read.'
    required: true
  repository:
    description: 'Repository in owner/repo format.'
    required: true
  author:
    description: 'Developer-agent bot login to enumerate.'
    required: true
  allowed-checks:
    description: 'JSON array of canonical Checks API check-run names.'
    required: true

outputs:
  prs:
    description: 'JSON array of {number, head_sha} objects suitable for a matrix.'
    value: ${{ steps.run.outputs.prs }}

runs:
  using: composite
  steps:
    - name: Resolve scripts directory
      id: scripts-dir
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        echo "dir=$(cd "$ACTION_PATH/../../scripts" && pwd)" >> "$GITHUB_OUTPUT"
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ steps.scripts-dir.outputs.dir }}/package-lock.json
    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      run: npm ci
    - name: Find failing agent PRs
      id: run
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_AUTHOR: ${{ inputs.author }}
        INPUT_ALLOWED_CHECKS: ${{ inputs.allowed-checks }}
      run: npx --no-install tsx src/find-failing-agent-prs.ts
