name: 'Find newly unblocked'
description: >
  Given a just-closed issue, returns the set of downstream issues that are
  now eligible for agent:developer application. An issue qualifies only when
  it is open, carries the `blocked` label, does not carry `agent:developer`,
  has no open agent PR on branch agent/issue-{N}, and has no remaining open
  blockers in its blocked-by list.

inputs:
  token:
    description: 'GitHub token with issue and pull-request read access'
    required: true
  repo:
    description: 'Repository in "owner/name" format (e.g. github.repository)'
    required: true
  closed-issue-number:
    description: 'Issue number of the just-closed issue'
    required: true

outputs:
  unblocked:
    description: 'JSON array of integer issue numbers that are now newly unblocked'
    value: ${{ steps.run.outputs.unblocked }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: .github/scripts/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: .github/scripts
      run: npm ci

    - name: Find newly unblocked
      id: run
      shell: bash
      working-directory: .github/scripts
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_CLOSED_ISSUE_NUMBER: ${{ inputs.closed-issue-number }}
      run: npx --no-install tsx src/find-newly-unblocked.ts
