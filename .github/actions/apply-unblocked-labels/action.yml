name: 'Apply unblocked labels'
description: >
  For each issue number in the unblocked list, applies the `agent:developer`
  label and removes the `blocked` label. Used by the auto-trigger unblock
  cascade after find-newly-unblocked identifies eligible issues.

inputs:
  token:
    description: 'GitHub token with issue write access'
    required: true
  repo:
    description: 'Repository in "owner/name" format (e.g. github.repository)'
    required: true
  unblocked:
    description: 'JSON array of integer issue numbers to process'
    required: true

runs:
  using: composite
  steps:
    # setup-node's cache-dependency-path is a glob resolved by @actions/glob,
    # which rejects '.' / '..' path segments, so the action-relative scripts
    # path must be normalized to an absolute path before it is used there.
    - name: Resolve scripts directory
      id: scripts-dir
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        echo "dir=$(cd "$ACTION_PATH/../../scripts" && pwd)" >> "$GITHUB_OUTPUT"
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ steps.scripts-dir.outputs.dir }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      run: npm ci

    - name: Apply unblocked labels
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_UNBLOCKED: ${{ inputs.unblocked }}
      run: npx --no-install tsx src/apply-unblocked-labels.ts
