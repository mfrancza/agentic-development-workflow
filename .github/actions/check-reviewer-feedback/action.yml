name: 'Check reviewer feedback'
description: >
  Decides whether agent-respond-review should proceed or skip. Applies
  defence-in-depth guards: skips self-authored reviews (review-author equals
  pr-author), routes commented reviews through the unresolved-thread check,
  and applies the bare-approval fallback for approved reviews when the thread
  count is unavailable. Output: proceed=true|false.

inputs:
  token:
    description: 'GitHub token with pull-requests:read scope'
    required: true
  review-state:
    description: 'Value of github.event.review.state (e.g. approved, changes_requested)'
    required: true
  review-body:
    description: 'Value of github.event.review.body'
    required: false
    default: ''
  review-id:
    description: 'Numeric review ID from the event payload'
    required: true
  pr-number:
    description: 'Pull request number the review was submitted on'
    required: true
  repo-owner:
    description: 'Repository owner login'
    required: true
  repo-name:
    description: 'Repository name'
    required: true
  review-author:
    description: 'GitHub login of the review author (github.event.review.user.login)'
    required: true
  pr-author:
    description: 'GitHub login of the PR author (github.event.pull_request.user.login)'
    required: true
  head-sha:
    description: >
      Current PR head SHA (github.event.pull_request.head.sha). When empty,
      the stale-SHA guard is skipped (fail-open) and the existing decision flow
      is applied unchanged.
    required: false
    default: ''
  review-commit-id:
    description: >
      The commit SHA the review was submitted against
      (github.event.review.commit_id). When empty, the stale-SHA guard falls
      through (does not skip on a missing value).
    required: false
    default: ''

outputs:
  proceed:
    description: "'true' if the workflow should respond to the review, 'false' to skip"
    value: ${{ steps.run.outputs.proceed }}

runs:
  using: composite
  steps:
    # setup-node's cache-dependency-path is a glob resolved by @actions/glob,
    # which rejects '.' / '..' path segments, so the action-relative scripts
    # path must be normalized to an absolute path before it is used there.
    - name: Resolve scripts directory
      id: scripts-dir
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        scripts_dir="$(cd "$ACTION_PATH/../../scripts" && pwd)"
        echo "dir=${scripts_dir}" >> "$GITHUB_OUTPUT"
        # Enable npm caching only when the lockfile is inside GITHUB_WORKSPACE.
        # setup-node uses @actions/glob, which cannot find files outside the
        # workspace. When this action is referenced remotely (uses: owner/repo/
        # .../action@ref), github.action_path resolves to the runner _actions
        # cache outside GITHUB_WORKSPACE, causing the cache step to fail.
        if [[ "${scripts_dir}" == "${GITHUB_WORKSPACE}"* ]]; then
          echo "cache-key-path=${scripts_dir}/package-lock.json" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ steps.scripts-dir.outputs.cache-key-path }}
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path == ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'

    - name: Install dependencies
      shell: bash
      run: npm ci
      working-directory: ${{ steps.scripts-dir.outputs.dir }}

    - name: Run check-reviewer-feedback
      id: run
      shell: bash
      run: npx --no-install tsx src/check-reviewer-feedback.ts
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REVIEW_STATE: ${{ inputs.review-state }}
        INPUT_REVIEW_BODY: ${{ inputs.review-body }}
        INPUT_REVIEW_ID: ${{ inputs.review-id }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_REPO_OWNER: ${{ inputs.repo-owner }}
        INPUT_REPO_NAME: ${{ inputs.repo-name }}
        INPUT_REVIEW_AUTHOR: ${{ inputs.review-author }}
        INPUT_PR_AUTHOR: ${{ inputs.pr-author }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        INPUT_REVIEW_COMMIT_ID: ${{ inputs.review-commit-id }}
