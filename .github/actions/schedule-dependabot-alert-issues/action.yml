name: Schedule Dependabot alert issues
description: Reconcile eligible alerts using separate reader and developer credentials.
inputs:
  enabled:
    description: Exact opt-in value
    required: true
  max-open-prs:
    description: Non-negative capacity limit; empty defaults to 3
    required: false
  repo-owner:
    description: Repository owner
    required: true
  repo-name:
    description: Repository name
    required: true
  reader-token:
    description: Dependabot reader installation token
    required: true
  writer-token:
    description: Developer installation token
    required: true
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../../scripts
      run: npm ci
    - name: Reconcile alerts
      shell: bash
      working-directory: ${{ github.action_path }}/../../scripts
      run: npx --no-install tsx src/schedule-dependabot-alert-issues.ts
      env:
        INPUT_ENABLED: ${{ inputs.enabled }}
        INPUT_MAX_OPEN_PRS: ${{ inputs.max-open-prs }}
        INPUT_REPO_OWNER: ${{ inputs.repo-owner }}
        INPUT_REPO_NAME: ${{ inputs.repo-name }}
        INPUT_READER_TOKEN: ${{ inputs.reader-token }}
        INPUT_WRITER_TOKEN: ${{ inputs.writer-token }}
