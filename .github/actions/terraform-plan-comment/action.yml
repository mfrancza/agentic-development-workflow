name: 'Terraform plan comment'
description: >
  Post or update the terraform plan output as a PR comment.  On the first
  call a new comment is created; on subsequent calls the activity finds the
  existing comment by the bot login and updates it in place, keeping a
  single evergreen comment per PR.

inputs:
  token:
    description: 'GitHub token with PR comment write access (issues: write)'
    required: true
  repo:
    description: 'Repository in "owner/name" format (e.g. github.repository)'
    required: true
  pr-number:
    description: 'Pull request number to comment on'
    required: true
  plan-file:
    description: >
      Path to the file containing the plain-text terraform plan output
      (produced by `terraform show -no-color <plan-file>`).
    required: true
  bot-login:
    description: >
      GitHub [bot] login that owns the comment (e.g. "terraform-ci[bot]").
      Used to find an existing comment to update in place.
    required: true

outputs:
  comment-id:
    description: 'ID of the created or updated PR comment'
    value: ${{ steps.run.outputs.comment_id }}

runs:
  using: composite
  steps:
    # setup-node's cache-dependency-path is a glob resolved by @actions/glob,
    # which rejects '.' / '..' path segments, so the action-relative scripts
    # path must be normalized to an absolute path before it is used there.
    - name: Resolve scripts directory
      id: scripts-dir
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        echo "dir=$(cd "$ACTION_PATH/../../scripts" && pwd)" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ steps.scripts-dir.outputs.dir }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      run: npm ci

    - name: Post terraform plan comment
      id: run
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_PLAN_FILE: ${{ inputs.plan-file }}
        INPUT_BOT_LOGIN: ${{ inputs.bot-login }}
      run: npx --no-install tsx src/terraform-plan-comment.ts
