name: 'Resolve deployment to workflow run + issue'
description: >
  Resolves a failed deployment SHA to (a) the workflow run that produced the
  deployment and (b) the originating issue number parsed from the merged PR's
  "Closes #N" reference. Sets proceed=false and skips cleanly if any lookup
  yields no result.

inputs:
  token:
    description: >
      GitHub token with actions:read and pull-requests:read on the repository.
    required: true
  repository:
    description: 'Repository in owner/repo format; call sites pass github.repository.'
    required: true
  sha:
    description: 'The deployment commit SHA.'
    required: true

outputs:
  proceed:
    description: '"true" if all lookups succeeded; "false" to skip.'
    value: ${{ steps.run.outputs.proceed }}
  run_id:
    description: 'ID of the failed workflow run.'
    value: ${{ steps.run.outputs.run_id }}
  issue_number:
    description: 'Issue number parsed from the merged PR body.'
    value: ${{ steps.run.outputs.issue_number }}

runs:
  using: composite
  steps:
    # setup-node's cache-dependency-path is a glob resolved by @actions/glob,
    # which rejects '.' / '..' path segments, so the action-relative scripts
    # path must be normalized to an absolute path before it is used there.
    - name: Resolve scripts directory
      id: scripts-dir
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        scripts_dir="$(cd "$ACTION_PATH/../../scripts" && pwd)"
        echo "dir=${scripts_dir}" >> "$GITHUB_OUTPUT"
        # Enable npm caching only when the lockfile is inside GITHUB_WORKSPACE.
        # setup-node uses @actions/glob, which cannot find files outside the
        # workspace. When this action is referenced remotely (uses: owner/repo/
        # .../action@ref), github.action_path resolves to the runner _actions
        # cache outside GITHUB_WORKSPACE, causing the cache step to fail.
        if [[ "${scripts_dir}" == "${GITHUB_WORKSPACE}"* ]]; then
          echo "cache-key-path=${scripts_dir}/package-lock.json" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ steps.scripts-dir.outputs.cache-key-path }}
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path == ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      run: npm ci

    - name: Resolve deployment
      id: run
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_SHA: ${{ inputs.sha }}
      run: npx --no-install tsx src/resolve-deployment.ts
