name: 'Find conflicted PRs'
description: >
  Enumerates open developer-agent PRs and identifies those with merge
  conflicts. When a pr-number input is provided (workflow_dispatch manual
  override), polls that single PR's mergeability and includes it regardless of
  result. Otherwise, lists all open PRs authored by the developer-agent bot,
  polls each one with exponential backoff until GitHub's async computation
  settles, and filters to CONFLICTING PRs. Emits a JSON array suitable for
  use as a matrix input.

inputs:
  token:
    description: 'GitHub token with pull-requests: read'
    required: true
  repo:
    description: 'Repository in owner/name format'
    required: true
  pr-number:
    description: >
      Optional PR number from workflow_dispatch. When set, bypasses
      enumeration and polls this PR directly (manual backstop).
    required: false
    default: ''
  author:
    description: 'Author filter used to enumerate developer-agent PRs'
    required: false
    default: 'app/mfrancza-developer-agent'
  all-authors:
    description: >
      When 'true', the GitHub search query drops the author:<developer-author>
      qualifier so every open PR in the repository is enumerated. Cross-repository
      (fork-headed) PRs are excluded from the results by calling
      GET /repos/{owner}/{repo}/pulls/{number} and comparing head/base repo full
      names. Defaults to 'false' to preserve the existing agent-only behavior.
    required: false
    default: 'false'

outputs:
  conflicted_prs:
    description: 'JSON array of conflicted PR numbers, e.g. [12, 34]'
    value: ${{ steps.run.outputs.conflicted_prs }}

runs:
  using: composite
  steps:
    # setup-node's cache-dependency-path is a glob resolved by @actions/glob,
    # which rejects '.' / '..' path segments, so the action-relative scripts
    # path must be normalized to an absolute path before it is used there.
    - name: Resolve scripts directory
      id: scripts-dir
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        scripts_dir="$(cd "$ACTION_PATH/../../scripts" && pwd)"
        echo "dir=${scripts_dir}" >> "$GITHUB_OUTPUT"
        # Enable npm caching only when the lockfile is inside GITHUB_WORKSPACE.
        # setup-node uses @actions/glob, which cannot find files outside the
        # workspace. When this action is referenced remotely (uses: owner/repo/
        # .../action@ref), github.action_path resolves to the runner _actions
        # cache outside GITHUB_WORKSPACE, causing the cache step to fail.
        if [[ "${scripts_dir}" == "${GITHUB_WORKSPACE}"* ]]; then
          echo "cache-key-path=${scripts_dir}/package-lock.json" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ steps.scripts-dir.outputs.cache-key-path }}
    - name: Set up Node.js
      if: steps.scripts-dir.outputs.cache-key-path == ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      run: npm ci

    - name: Find conflicted PRs
      id: run
      shell: bash
      working-directory: ${{ steps.scripts-dir.outputs.dir }}
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_AUTHOR: ${{ inputs.author }}
        INPUT_ALL_AUTHORS: ${{ inputs.all-authors }}
      run: npx --no-install tsx src/find-conflicted-prs.ts
