name: agent-design

# Trigger 1 (issues.labeled): runs the designer agent when the agent:design
# label is applied to an open issue by an allowlisted user.
# Trigger 2 (pull_request.closed): removes the draft label from sub-issues
# when a design-branch PR merges.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  call-design:
    # Gate on the agent:design label name and sender allowlist. Triggering on
    # label application (rather than issue open) mirrors agent-implement.yml
    # and lets users control which issues get designed. The allowlist is managed
    # as a Terraform parameter (vars.AGENT_ALLOWLIST) so usernames are not
    # hardcoded in YAML — run `terraform apply` to update it.
    #
    # Security: the reusable's authorize job checks the sender allowlist before
    # it enters its concurrency group. Keep this caller limited to queue
    # predicates; lifecycle state is checked by the reusable gate.
    if: >
      github.event.label.name == 'agent:design'
    uses: ./.github/workflows/agent-design-reusable.yml
    with:
      run-design: true
      issue-number: ${{ github.event.issue.number }}
      repo: ${{ github.repository }}
      image: ${{ vars.DEVELOPER_IMAGE }}
      default-model: ${{ vars.DESIGN_DEFAULT_MODEL || vars.DEFAULT_MODEL }}
      logs-retention-days: 30
      helpers-ref: ${{ github.sha }}
      sender-login: ${{ github.event.sender.login }}
      issue-state: ${{ github.event.issue.state }}
    secrets:
      DEVELOPER_APP_ID: ${{ secrets.DEVELOPER_APP_ID }}
      DEVELOPER_APP_PRIVATE_KEY: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ALLOWLIST_RESOLVER_APP_ID: ${{ secrets.ALLOWLIST_RESOLVER_APP_ID }}
      ALLOWLIST_RESOLVER_APP_PRIVATE_KEY: ${{ secrets.ALLOWLIST_RESOLVER_APP_PRIVATE_KEY }}

  call-undraft:
    # The same-repository guard remains in the caller trust boundary. The
    # reusable gate accepts only merged design/issue-* PRs. This cleanup path
    # does not use the design-run authorize job; sender-login is passed to
    # satisfy the reusable's shared workflow-call contract.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/agent-design-reusable.yml
    with:
      run-undraft: true
      pr-head-ref: ${{ github.event.pull_request.head.ref }}
      repo: ${{ github.repository }}
      helpers-ref: ${{ github.sha }}
      sender-login: ${{ github.event.sender.login }}
      pr-merged: ${{ github.event.pull_request.merged }}
    secrets:
      DEVELOPER_APP_ID: ${{ secrets.DEVELOPER_APP_ID }}
      DEVELOPER_APP_PRIVATE_KEY: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
