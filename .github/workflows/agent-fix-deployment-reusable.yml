name: agent-fix-deployment (reusable)

# Reusable workflow extracted from agent-fix-deployment.yml.
# Callers supply the deployment_status trigger, the failure/error state
# condition, and the concurrency group; this workflow resolves the
# deployment context and runs the developer agent.
#
# NOTE on github.event in reusable workflows: within a reusable workflow
# github.event is the workflow_call event payload, not the calling workflow's
# original event. All event data that steps need must therefore be passed
# as explicit inputs: see the with: block in agent-fix-deployment.yml.
#
# External consumers: this workflow self-checks out helper actions into
# _agentic-workflow/ before any composite-action step runs. The checkout ref
# is github.job_workflow_sha (pending replacement by helpers-ref in Issue #537;
# see AGENTS.md § Known traps). No checkout of the caller workspace is performed.

on:
  workflow_call:
    inputs:
      deployment-sha:
        description: 'SHA of the failed deployment (github.event.deployment.sha)'
        type: string
        required: true
      image:
        description: >
          Pre-built agent image reference to pull (e.g.
          ghcr.io/owner/repo/developer:v1). Leave empty (default) to build
          from the local Docker build context instead — the mode used by
          this repository's self-hosted runs.
        type: string
        required: false
        default: ''
      helpers-ref:
        description: >
          Git ref (tag, branch, or full commit SHA) of
          mfrancza/agentic-development-workflow to check out for helper
          actions. Must not be empty. Repository-owned callers pass
          github.sha; external callers pass the same ref used in the uses:
          selector (e.g. v0, v0.0.2, or a full SHA).
        required: true
        type: string
    secrets:
      DEVELOPER_APP_ID:
        required: true
      DEVELOPER_APP_PRIVATE_KEY:
        required: true
      # LLM API keys are declared required: false so that callers who use only
      # one provider (e.g. Anthropic only) do not need to set placeholder secrets
      # for the other two. The container entrypoint validates at runtime that the
      # key matching the resolved model is present, so an absent key causes a
      # clear runtime error rather than a silent no-op.
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      XAI_API_KEY:
        required: false

permissions:
  contents: read
  actions: read         # for listWorkflowRunsForRepo in resolve-deployment activity
  pull-requests: read   # for listPullRequestsAssociatedWithCommit + pulls.get in resolve-deployment activity

jobs:
  fix-deployment:
    # No if: condition here — the caller's job already gates on
    # deployment_status.state == 'failure' or 'error'. Adding that condition
    # here would incorrectly reference the workflow_call event (which has no
    # deployment_status property).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi

      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false

      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"

      # Resolve the failed deployment to (a) the workflow run that produced
      # the deploy (so the agent can read its failed-job logs), and (b) the
      # originating issue number (parsed out of the merged PR's "Closes #N").
      # Skip cleanly if either lookup fails — better than handing the agent
      # incomplete context.
      - name: Resolve deployment to workflow run + issue
        id: lookup
        uses: ./_agentic-workflow/.github/actions/resolve-deployment
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          sha: ${{ inputs.deployment-sha }}

      # Mint only after the lookup succeeds — no installation token for runs we skip.
      - name: Mint installation token for developer-agent
        if: steps.lookup.outputs.proceed == 'true'
        id: setup
        uses: ./_agentic-workflow/.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Resolve Claude model from issue labels
        if: steps.lookup.outputs.proceed == 'true'
        id: model
        uses: ./_agentic-workflow/.github/actions/resolve-model
        with:
          token: ${{ steps.setup.outputs.token }}
          subject-type: issue
          subject-number: ${{ steps.lookup.outputs.issue_number }}
          repo: ${{ github.repository }}
          default-model: ${{ vars.DEFAULT_MODEL }}
          agent-type: developer

      - name: Prepare agent log directory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agent-logs"
          chmod 0777 "${RUNNER_TEMP}/agent-logs"

      - name: Run agent
        if: steps.lookup.outputs.proceed == 'true'
        uses: ./_agentic-workflow/.github/actions/run-agent
        with:
          image: ${{ inputs.image }}
          gh-token: ${{ steps.setup.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          repo: ${{ github.repository }}
          agent-action: fix-deployment
          run-id: ${{ steps.lookup.outputs.run_id }}
          issue-number: ${{ steps.lookup.outputs.issue_number }}
          model: ${{ steps.model.outputs.claude_model }}
          logs-dir: ${{ runner.temp }}/agent-logs

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-fix-deployment-issue-${{ steps.lookup.outputs.issue_number }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs
          retention-days: 30
          if-no-files-found: warn
