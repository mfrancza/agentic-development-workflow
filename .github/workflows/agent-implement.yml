name: agent-implement

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: agent-implement-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # Gate on the user who applied the label, not who opened the issue. The
    # allowlist is managed as a Terraform parameter (vars.AGENT_ALLOWLIST) so
    # usernames are not hardcoded in YAML — run `terraform apply` to update it.
    # GitHub has no per-label permission model and `repository_owner` doesn't
    # work in org repos (it's the org login, not a user).
    #
    # Security: the allowlist check lives here in the caller stub, not in the
    # reusable, so external callers cannot accidentally skip it by calling the
    # reusable directly without gating.
    if: >
      github.event.label.name == 'agent:developer' &&
      github.event.issue.state == 'open' &&
      contains(fromJSON(vars.AGENT_ALLOWLIST), github.event.sender.login)
    uses: ./.github/workflows/agent-implement-reusable.yml
    with:
      issue-number: ${{ github.event.issue.number }}
      repo: ${{ github.repository }}
      image: ${{ vars.DEVELOPER_IMAGE }}
      default-model: ${{ vars.DEFAULT_MODEL }}
      code-reviewers: ${{ vars.CODE_REVIEWERS }}
      logs-retention-days: 30
      helpers-ref: ${{ github.sha }}
    secrets: inherit
