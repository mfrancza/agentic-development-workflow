name: agent-fix-deployment

on:
  deployment_status:

permissions:
  contents: read
  actions: read         # for listWorkflowRunsForRepo in resolve-deployment activity
  pull-requests: read   # for listPullRequestsAssociatedWithCommit + pulls.get in resolve-deployment activity

concurrency:
  group: agent-fix-deployment-${{ github.event.deployment.sha }}
  cancel-in-progress: false

jobs:
  fix-deployment:
    if: >
      github.event.deployment_status.state == 'failure' ||
      github.event.deployment_status.state == 'error'
    uses: ./.github/workflows/agent-fix-deployment-reusable.yml
    with:
      deployment-sha: ${{ github.event.deployment.sha }}
      image: ''
      helpers-ref: ${{ github.sha }}
    secrets:
      DEVELOPER_APP_ID:          ${{ secrets.DEVELOPER_APP_ID }}
      DEVELOPER_APP_PRIVATE_KEY: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY:               ${{ secrets.XAI_API_KEY }}
