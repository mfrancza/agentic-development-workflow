name: agent-fix-deployment

on:
  deployment_status:

permissions:
  contents: read
  actions: read         # for listWorkflowRunsForRepo in resolve-deployment activity
  pull-requests: read   # for listPullRequestsAssociatedWithCommit + pulls.get in resolve-deployment activity

concurrency:
  group: agent-fix-deployment-${{ github.event.deployment.sha }}
  cancel-in-progress: false

jobs:
  fix-deployment:
    if: >
      github.event.deployment_status.state == 'failure' ||
      github.event.deployment_status.state == 'error'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Checkout must precede the local agent-token action: the runner resolves
      # ./.github/actions/* references from the workspace.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # Resolve the failed deployment to (a) the workflow run that produced
      # the deploy (so the agent can read its failed-job logs), and (b) the
      # originating issue number (parsed out of the merged PR's "Closes #N").
      # Skip cleanly if either lookup fails — better than handing the agent
      # incomplete context.
      - name: Resolve deployment to workflow run + issue
        id: lookup
        uses: ./.github/actions/resolve-deployment
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          sha: ${{ github.event.deployment.sha }}

      # Mint only after the lookup succeeds — no installation token for runs we skip.
      - name: Mint installation token for developer-agent
        if: steps.lookup.outputs.proceed == 'true'
        id: setup
        uses: ./.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Resolve Claude model from issue labels
        if: steps.lookup.outputs.proceed == 'true'
        id: model
        uses: ./.github/actions/resolve-model
        with:
          token: ${{ steps.setup.outputs.token }}
          subject-type: issue
          subject-number: ${{ steps.lookup.outputs.issue_number }}
          repo: ${{ github.repository }}
          default-model: ${{ vars.DEFAULT_MODEL }}

      - name: Run agent
        if: steps.lookup.outputs.proceed == 'true'
        uses: ./.github/actions/run-agent
        with:
          gh-token: ${{ steps.setup.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          repo: ${{ github.repository }}
          agent-action: fix-deployment
          run-id: ${{ steps.lookup.outputs.run_id }}
          issue-number: ${{ steps.lookup.outputs.issue_number }}
          model: ${{ steps.model.outputs.claude_model }}
