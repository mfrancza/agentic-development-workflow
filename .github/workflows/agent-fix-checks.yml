name: agent-fix-checks

on:
  workflow_run:
    # `workflows:` is required by the GitHub Actions schema — without it the
    # file fails validation with "on.workflow_run does not reference any
    # workflows". No real CI workflow exists in this repo yet; "CI" is a
    # placeholder. Update this list (or add the CI workflow with this name)
    # when CI lands so fix-checks actually fires on its failures.
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read  # for pulls.get in the filter-agent-pr activity

concurrency:
  # Fall back to workflow_run.id when the run isn't tied to a PR — otherwise
  # unrelated PR-less workflow runs all collide on `agent-fix-checks-pr-`.
  group: agent-fix-checks-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  fix-checks:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Checkout must precede the local agent-token action: the runner resolves
      # ./.github/actions/* references from the workspace.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # The workflow_run event payload doesn't include the PR author, so look it
      # up and only proceed if the PR was authored by the developer agent.
      # This is the trust gate: we only react to checks failing on the
      # agent's own PRs, never on PRs from other authors.
      - name: Filter to agent-authored PRs
        id: filter
        uses: ./.github/actions/filter-agent-pr
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          agent-login: mfrancza-developer-agent[bot]

      # Mint only after the trust gate — no installation token for runs we skip.
      - name: Mint installation token for developer-agent
        if: steps.filter.outputs.proceed == 'true'
        id: setup
        uses: ./.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Prepare agent log directory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agent-logs"
          chmod 0777 "${RUNNER_TEMP}/agent-logs"

      - name: Run agent
        if: steps.filter.outputs.proceed == 'true'
        uses: ./.github/actions/run-agent
        with:
          gh-token: ${{ steps.setup.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          repo: ${{ github.repository }}
          agent-action: fix-checks
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          model: ${{ vars.DEFAULT_MODEL }}
          logs-dir: ${{ runner.temp }}/agent-logs

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-fix-checks-pr-${{ github.event.workflow_run.pull_requests[0].number }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs
          retention-days: 30
          if-no-files-found: warn
