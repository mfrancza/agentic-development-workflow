name: agent-pr-merged

# Fires when any PR is closed (merged or abandoned) and removes the
# agent:developer label from the linked issue when the PR was authored by
# the developer-agent bot.  Label removal fires for both merged and abandoned
# PRs — in both cases the developer agent's iterative loop is definitively over.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  # SECURITY EXCEPTION (Decision 8 of docs/design/refactor-github-actions.md):
  # Neither job below performs a workspace checkout. On pull_request.closed
  # events, a merged PR that modifies .github/actions/agent-token would execute
  # the modified composite action while DEVELOPER_APP_PRIVATE_KEY is in scope if
  # a checkout were present. By omitting the checkout entirely, there is no
  # local code-execution path that a merged PR can influence.
  #
  # Pass the event body as an explicit reusable-workflow input. The reusable
  # gate parses its typed input before taking the per-PR concurrency lock or
  # minting an installation token.

  remove-developer-label:
    # Only act on PRs authored by the developer-agent bot.  Both merged and
    # abandoned PRs are handled — in either case the developer agent's
    # iterative loop is definitively over.
    if: github.event.pull_request.user.login == 'mfrancza-developer-agent[bot]'
    uses: ./.github/workflows/agent-pr-merged-reusable.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      pr-body: ${{ github.event.pull_request.body }}
    secrets:
      DEVELOPER_APP_ID: ${{ secrets.DEVELOPER_APP_ID }}
      DEVELOPER_APP_PRIVATE_KEY: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
