name: secret-scan (reusable)

# Reusable workflow extracted from secret-scan.yml.
# Full-history secret scan using gitleaks. Callers supply the event
# triggers, branch filters, schedule, and concurrency group; this workflow
# performs the actual install, scan, and artifact upload.
#
# Consumers who fork this repository can call this workflow from their own
# secret-scan.yml. The gitleaks version and checksum are exposed as
# optional inputs so consumers can pin to a different release without
# forking this file. Update both inputs together when bumping gitleaks.

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: >
          gitleaks release version to download (without the leading "v"),
          e.g. 8.28.0. Must be updated in lockstep with gitleaks-sha256.
        type: string
        required: false
        default: '8.28.0'
      gitleaks-sha256:
        description: >
          SHA-256 checksum of the gitleaks linux_x64 tarball for the chosen
          version. Verified before extraction to detect tampered releases.
          Must be updated in lockstep with gitleaks-version.
        type: string
        required: false
        default: 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 gives gitleaks the full commit graph so `--log-opts
      # "--all"` can walk every branch and tag ref reachable in the checkout.
      # Per actions/checkout docs, fetch-depth: 0 already fetches all history
      # for all branches and tags; fetch-tags is only needed for shallow clones.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Install gitleaks by downloading the pinned release tarball and
      # verifying its SHA-256 checksum. Pinning to a specific version (and
      # checksum) means a compromised or retagged release can't silently ship
      # into CI. Bump gitleaks-version and gitleaks-sha256 inputs together
      # when updating.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
          GITLEAKS_SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl --fail --silent --show-error --location --retry 3 --output "$tarball" "$url"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --status
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" gitleaks
          gitleaks version

      # Full-history scan across every ref reachable in the checkout. Known
      # false positives are silenced by fingerprint in `.gitleaksignore`. Any
      # finding not in that file fails the job (default `--exit-code 1`).
      # `--redact` keeps secret values out of workflow logs even on failure.
      - name: Run gitleaks (full history)
        run: |
          set -euo pipefail
          gitleaks git \
            --log-opts="--all" \
            --gitleaks-ignore-path=.gitleaksignore \
            --redact \
            --report-format=json \
            --report-path=gitleaks-report.json \
            --verbose

      # Upload the report even on success so the audit trail is preserved.
      # `if: always()` also captures the report when the previous step fails,
      # which is when the artifact is most useful.
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 30
