name: protected-approval-gate-backfill

# Dispatch after enabling the gate (any OFF → ON change) so every open pull
# request gets the current result under the enforcing context, replacing any
# stale result from an earlier enabled period. See docs/adopting.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write

jobs:
  sweep:
    uses: ./.github/workflows/protected-approval-gate-sweep-reusable.yml
    with:
      protected-pr-author-logins: ${{ vars.PROTECTED_PR_AUTHOR_LOGINS }}
      required-approval-count: ${{ vars.REQUIRED_APPROVAL_COUNT }}
      enabled: ${{ vars.ENABLE_PROTECTED_APPROVAL_GATE }}
      repo: ${{ github.repository }}
      helpers-ref: ${{ github.sha }}
