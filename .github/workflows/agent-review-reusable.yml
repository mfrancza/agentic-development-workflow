name: agent-review (reusable)

# Reusable workflow — call this from agent-review.yml (or any external caller)
# to run the reviewer agent on a specific pull request.
#
# Reviewer-set fan-out: a preflight job (resolve) applies the three-tier
# waterfall in the resolve-reviewer-set composite action to determine which
# models will review the PR:
#   1. Per-PR model:review:* labels.
#   2. Repo-wide REVIEWER_MODELS list (inputs.reviewer-models).
#   3. Single-reviewer fallback: generic model:* label on the PR →
#      inputs.default-model.
# The matrix review job (review) fans out over the resolved set with
# fail-fast: false so one leg's failure does not cancel the others.  Each
# matrix leg mints its own reviewer-agent installation token, dismisses stale
# reviews posted against an older head SHA, runs the reviewer container,
# uploads its own log artifact (named with the model slug), and resolves its
# own addressed review threads.
#
# Security: all trust-model checks (PR state, same-repo enforcement, sender
# allowlist, synchronize-path label check) are the caller's responsibility;
# this reusable performs none of them.  Keep those conditions in the caller
# stub.  External callers MUST apply equivalent fork-exclusion and allowlist
# checks before invoking this workflow.
#
# The caller must use `pull_request_target` (not `pull_request`) so that the
# workflow YAML and the docker/reviewer build context are always loaded from
# the base branch, never from the PR head.  This reusable is designed to be
# called only from pull_request_target-triggered workflows.
#
# External consumers: pass `image` to use a published reviewer image and
# skip the Docker build, e.g.:
#   image: ghcr.io/mfrancza/agentic-development-workflow/reviewer:v1
# Leave image empty (the default) to build from ./docker/reviewer —
# this repo's own caller stub relies on the default.

on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Pull request number to review'
        required: true
        type: number
      repo:
        description: 'GitHub repository (owner/name), e.g. octocat/my-repo'
        required: true
        type: string
      image:
        description: >
          Pre-built reviewer image reference to pull and run (e.g.
          ghcr.io/mfrancza/agentic-development-workflow/reviewer:v1).
          Leave empty (the default) to build the reviewer image from
          ./docker/reviewer — this repo uses this mode.
        required: false
        type: string
        default: ''
      default-model:
        description: 'Default Claude model when no model label is present on the PR'
        required: false
        type: string
        default: ''
      reviewer-models:
        description: >
          JSON-encoded list of model names from the REVIEWER_MODELS Actions
          variable (e.g. '["sonnet","gpt-5"]'). An empty string or empty JSON
          array ("[]") disables Tier 2 and falls through to the single-reviewer
          waterfall. Default: empty string (feature disabled; single-reviewer
          mode preserved).
        required: false
        type: string
        default: ''
      logs-retention-days:
        description: 'Days to retain uploaded log artifacts'
        required: false
        type: number
        default: 30
      helpers-ref:
        description: >
          Git ref (tag, branch, or full commit SHA) of
          mfrancza/agentic-development-workflow to check out for helper
          actions. Must not be empty. Repository-owned callers pass
          github.sha; external callers pass the same ref used in the uses:
          selector (e.g. v0, v0.0.2, or a full SHA).
        required: true
        type: string
    secrets:
      REVIEWER_APP_ID:
        required: true
      REVIEWER_APP_PRIVATE_KEY:
        required: true
      # LLM API keys are declared required: false so that callers who use only
      # one provider (e.g. Anthropic only) do not need to set placeholder secrets
      # for the other two. The container entrypoint validates at runtime that the
      # key matching the resolved model is present, so an absent key causes a
      # clear runtime error rather than a silent no-op.
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      XAI_API_KEY:
        required: false

# Deny-all at the workflow level; write scopes needed by specific jobs are
# declared on those jobs so any future job added here starts with no permissions.
permissions: {}

jobs:
  # Preflight job: resolves the reviewer set once per workflow run and fetches
  # the PR head SHA, then passes both to the matrix review job via outputs.
  # Fails loudly if the resolved set is empty (should not occur — the resolver
  # always yields at least inputs.default-model).
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      set: ${{ steps.resolve-set.outputs.set }}
      head-sha: ${{ steps.pr-head.outputs.sha }}
    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi

      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false

      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"

      - name: Read authoring model from PR body
        # Reads the <!-- authored-by-model: … --> marker injected by the
        # developer/design entrypoint. Output authoring_model is an empty string
        # when the marker is absent; the pairing tier is silently skipped in that
        # case (no error — the marker lands only on PRs opened after the feature
        # was deployed).
        id: author
        uses: ./_agentic-workflow/.github/actions/find-authored-by-model
        with:
          token: ${{ github.token }}
          repository: ${{ inputs.repo }}
          pr-number: ${{ inputs.pr-number }}

      - name: Compute available providers
        # Derives a JSON array of provider names whose corresponding API key is
        # non-empty in the calling workflow's secret context. The pairing resolver
        # uses this list to avoid picking a model whose key is unset.
        # Values written to GITHUB_OUTPUT are hardcoded provider-name strings
        # ("anthropic", "openai", "xai"), not user-controlled data, so no
        # CR/LF stripping is required.
        id: providers
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_XAI: ${{ secrets.XAI_API_KEY != '' }}
        run: |
          set -euo pipefail
          list=""
          [[ "${HAS_ANTHROPIC}" == "true" ]] && list="${list:+${list},}\"anthropic\""
          [[ "${HAS_OPENAI}" == "true" ]] && list="${list:+${list},}\"openai\""
          [[ "${HAS_XAI}" == "true" ]] && list="${list:+${list},}\"xai\""
          echo "list=[${list}]" >> "$GITHUB_OUTPUT"

      - name: Resolve reviewer set
        id: resolve-set
        uses: ./_agentic-workflow/.github/actions/resolve-reviewer-set
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          repo: ${{ inputs.repo }}
          reviewer-models: ${{ inputs.reviewer-models }}
          default-model: ${{ inputs.default-model }}
          pair-policy: ${{ vars.REVIEW_MODEL_PAIRING }}
          authoring-model: ${{ steps.author.outputs.authoring_model }}
          available-providers: ${{ steps.providers.outputs.list }}

      - name: Fail loudly if reviewer set is empty
        env:
          REVIEWER_SET: ${{ steps.resolve-set.outputs.set }}
        run: |
          set -euo pipefail
          count=$(echo "${REVIEWER_SET}" | jq 'length')
          if [[ "${count}" -eq 0 ]]; then
            echo "::error::Reviewer set resolved to an empty array. The resolver should always yield at least the default model."
            exit 1
          fi
          echo "Resolved reviewer set has ${count} reviewer(s)."
          if [[ "${count}" -gt 3 ]]; then
            echo "::warning::Resolved reviewer set has ${count} reviewers; each push will fan out to ${count} parallel review passes and spend ~${count}× review cost."
          fi

      - name: Fetch PR head SHA
        id: pr-head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "sha=$(printf '%s' "${sha}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

  review:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # contents: write + pull-requests: write are for the "Resolve addressed
    # review threads" step only. The resolveReviewThread GraphQL mutation
    # requires a token with Contents: write
    # (github.com/orgs/community/discussions/44650), and the reviewer app token
    # is deliberately Contents: read-only — the no-push guarantee in
    # docs/design/reviewer-container.md decision 3 — so the container records
    # addressed thread IDs to a mounted file and this job's GITHUB_TOKEN
    # resolves them afterwards. GITHUB_TOKEN never enters the container; only
    # trusted base-branch workflow code runs in job steps (pull_request_target
    # + default checkout of GITHUB_SHA (current base tip) with
    # persist-credentials: false), so
    # the write scope is not exposed to PR-authored code.
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.set) }}
    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi

      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false

      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"

      - name: Mint installation token for reviewer-agent
        id: setup
        uses: ./_agentic-workflow/.github/actions/agent-token
        with:
          client-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      - name: Slugify model name for artifact
        # Passes matrix.model through env: so the value is never interpolated
        # directly into the shell script (output-injection hygiene).
        id: slug
        env:
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          slugified=$(echo "${MODEL}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-*//;s/-*$//')
          echo "value=$(printf '%s' "${slugified}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Dismiss stale reviewer-bot CHANGES_REQUESTED reviews
        # Fail-open: dismissal is defence-in-depth (see Decision 2 of
        # docs/design/reviewer-supersede-stale-verdict.md). If this step
        # errors the review pass still runs; continue-on-error ensures a step
        # failure does not cancel the job. The activity itself also uses
        # core.warning() rather than core.setFailed() for individual API
        # errors, so the common case is a clean zero exit.
        # head-sha filters to only dismiss reviews posted against an earlier
        # head SHA, preserving sibling-leg verdicts on the current SHA.
        continue-on-error: true
        uses: ./_agentic-workflow/.github/actions/dismiss-stale-reviewer-reviews
        with:
          token: ${{ steps.setup.outputs.token }}
          repo: ${{ inputs.repo }}
          pr-number: ${{ inputs.pr-number }}
          head-sha: ${{ needs.resolve.outputs.head-sha }}

      - name: Prepare agent log directory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agent-logs"
          chmod 0777 "${RUNNER_TEMP}/agent-logs"

      - name: Run reviewer agent
        # The container records the GraphQL IDs of addressed review threads
        # into the mounted output directory; the resolve step below reads them.
        # Per-leg output-dir uses strategy.job-index to make the path explicit
        # (each matrix leg already runs on its own runner, so isolation is
        # structural, but the index makes the path self-documenting).
        uses: ./_agentic-workflow/.github/actions/run-agent
        with:
          image: ${{ inputs.image }}
          build-context: _agentic-workflow/docker/reviewer
          image-tag: agent-reviewer:ci
          gh-token: ${{ steps.setup.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          repo: ${{ inputs.repo }}
          pr-number: ${{ inputs.pr-number }}
          model: ${{ matrix.model }}
          output-dir: ${{ runner.temp }}/reviewer-output-${{ strategy.job-index }}
          output-mount: /agent-output
          resolve-threads-file: /agent-output/resolve-threads.txt
          logs-dir: ${{ runner.temp }}/agent-logs

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-review-pr-${{ inputs.pr-number }}-${{ steps.slug.outputs.value }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs
          retention-days: ${{ inputs.logs-retention-days }}
          if-no-files-found: warn

      - name: Resolve addressed review threads
        # Runs with the workflow GITHUB_TOKEN (see the permissions comment at
        # the top of this job), not the reviewer app token — so threads show
        # as resolved by github-actions[bot]. The recorded IDs are
        # agent-generated output derived from PR content, so they are treated
        # as untrusted: each ID is format-checked and intersected against the
        # PR's actual open threads before the mutation is issued.
        # resolve-file reads this leg's own output directory.
        uses: ./_agentic-workflow/.github/actions/resolve-review-threads
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          repo: ${{ inputs.repo }}
          resolve-file: ${{ runner.temp }}/reviewer-output-${{ strategy.job-index }}/resolve-threads.txt
