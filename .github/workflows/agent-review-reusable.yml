name: agent-review (reusable)

# Authorizes the triggering actor before a per-PR wrapper holds one lock around
# the nested worker's resolver and parallel reviewer matrix.
on:
  workflow_call:
    inputs:
      pr-number: { required: true, type: number }
      repo: { required: true, type: string }
      image: { required: false, type: string, default: '' }
      default-model: { required: false, type: string, default: '' }
      reviewer-models: { required: false, type: string, default: '' }
      logs-retention-days: { required: false, type: number, default: 30 }
      helpers-ref: { required: true, type: string }
      sender-login: { required: true, type: string }
      event-action: { required: true, type: string }
    secrets:
      REVIEWER_APP_ID: { required: true }
      REVIEWER_APP_PRIVATE_KEY: { required: true }
      ANTHROPIC_API_KEY: { required: false }
      OPENAI_API_KEY: { required: false }
      XAI_API_KEY: { required: false }
      ALLOWLIST_RESOLVER_APP_ID: { required: false }
      ALLOWLIST_RESOLVER_APP_PRIVATE_KEY: { required: false }

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi
      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false
      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"
      - name: Detect team references
        id: detect
        env:
          ALLOWLIST: ${{ vars.AGENT_ALLOWLIST }}
        run: |
          has=false
          if [[ -n "$ALLOWLIST" ]] && jq -e 'any(.[]; type == "string" and contains("/"))' <<< "$ALLOWLIST" >/dev/null; then
            has=true
          fi
          echo "allowlist_has_team=$has" >> "$GITHUB_OUTPUT"
          echo "needs_resolver=$has" >> "$GITHUB_OUTPUT"
      - name: Mint installation token for allowlist resolver
        id: allowlist-resolver
        if: steps.detect.outputs.needs_resolver == 'true'
        continue-on-error: true
        uses: ./_agentic-workflow/.github/actions/agent-token
        with:
          client-id: ${{ secrets.ALLOWLIST_RESOLVER_APP_ID }}
          private-key: ${{ secrets.ALLOWLIST_RESOLVER_APP_PRIVATE_KEY }}
      - name: Check agent allowlist
        uses: ./_agentic-workflow/.github/actions/check-agent-allowlist
        with:
          allowlist: ${{ vars.AGENT_ALLOWLIST }}
          principal: ${{ inputs.sender-login }}
          skip-gate: ${{ inputs.event-action == 'synchronize' }}
          resolver-token: ${{ steps.allowlist-resolver.outputs.token }}
  review:
    needs: authorize
    concurrency:
      group: agent-review-pr-${{ inputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/agent-review-worker-reusable.yml
    with:
      pr-number: ${{ inputs.pr-number }}
      repo: ${{ inputs.repo }}
      image: ${{ inputs.image }}
      default-model: ${{ inputs.default-model }}
      reviewer-models: ${{ inputs.reviewer-models }}
      logs-retention-days: ${{ inputs.logs-retention-days }}
      helpers-ref: ${{ inputs.helpers-ref }}
    secrets:
      REVIEWER_APP_ID: ${{ secrets.REVIEWER_APP_ID }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
