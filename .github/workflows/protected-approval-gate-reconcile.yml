name: protected-approval-gate-reconcile

# Safety net: re-publishes the gate check on every open pull request once every
# ENABLE_PROTECTED_APPROVAL_GATE_RECONCILE_MINUTES (default 10). The cron fires
# every minute because schedules cannot read Actions variables; the sweep's
# interval guard skips runs that come too soon after the last successful one.
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write

concurrency:
  group: protected-approval-gate-reconcile
  cancel-in-progress: false

jobs:
  sweep:
    uses: ./.github/workflows/protected-approval-gate-sweep-reusable.yml
    with:
      protected-pr-author-logins: ${{ vars.PROTECTED_PR_AUTHOR_LOGINS }}
      required-approval-count: ${{ vars.REQUIRED_APPROVAL_COUNT }}
      enabled: ${{ vars.ENABLE_PROTECTED_APPROVAL_GATE }}
      repo: ${{ github.repository }}
      helpers-ref: ${{ github.sha }}
      interval-minutes: ${{ vars.ENABLE_PROTECTED_APPROVAL_GATE_RECONCILE_MINUTES }}
