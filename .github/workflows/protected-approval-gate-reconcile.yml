name: protected-approval-gate-reconcile

# Manual recovery: re-publishes the gate check on every open pull request.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: protected-approval-gate-reconcile
  cancel-in-progress: false

jobs:
  sweep:
    uses: ./.github/workflows/protected-approval-gate-sweep-reusable.yml
    with:
      repo: ${{ github.repository }}
      interval-minutes: ${{ vars.ENABLE_PROTECTED_APPROVAL_GATE_RECONCILE_MINUTES }}
