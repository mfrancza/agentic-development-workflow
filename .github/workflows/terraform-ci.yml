name: Terraform CI

# Runs Terraform CI in two modes depending on the triggering event:
#   - pull_request_target: plan on PR, post plan output as a comment.
#   - push to main:        apply after each qualifying merge.
#
# pull_request_target (not pull_request) is intentional: GitHub always resolves
# the workflow YAML and local composite actions (.github/actions/**) from the
# *base* branch, so a PR that modifies terraform-ci.yml or the plan-comment
# activity cannot cause its modified copy to run against the terraform-ci token.
# The plan job checks out the PR head explicitly for the Terraform steps.
# See docs/design/terraform-ci.md Decision 2 for the full threat-model rationale.

on:
  pull_request_target:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
      - '.github/workflows/terraform-ci-reusable.yml'
      - '.github/actions/terraform-plan-comment/**'
      - '.github/scripts/**'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
      - '.github/workflows/terraform-ci-reusable.yml'
      - '.github/actions/terraform-plan-comment/**'

# Workflow-level permissions are the ceiling GitHub enforces on the CALLED
# (reusable) workflow's jobs at run creation: job-level `permissions` on a
# `uses:` job cannot elevate past this, and the whole job graph is validated
# at startup regardless of `if:` conditions — a deny-all here therefore
# startup-fails every run because the reusable plan job requests
# pull-requests: write (observed: "The nested job 'plan' is requesting
# 'pull-requests: write', but is only allowed 'pull-requests: none'", issue
# #487). Grant the union needed by the reusable jobs here; the apply job
# downgrades below.
permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    # Only on pull_request_target and only for same-repo PRs.
    # Fork-headed PRs are excluded: even with pull_request_target running
    # base-branch code, the attacker-controlled Terraform diff executes in
    # the job under a token with Administration:R/W scope.  Collaborators who
    # need a plan of a fork's changes should cherry-pick onto a same-repo
    # branch first (same policy as agent-review.yml).
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Inherits the workflow-level grant (contents: read, pull-requests: write)
    # — see the note on `permissions` above for why the grant lives there.
    uses: ./.github/workflows/terraform-ci-reusable.yml
    with:
      event: pull_request
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  apply:
    if: github.event_name == 'push'
    # No job-level permissions downgrade here: GitHub validates every caller
    # job against EVERY job in the called workflow, ignoring `if:` conditions
    # — a `contents: read`-only grant on this job startup-fails the whole
    # workflow because the reusable's *plan* job requests pull-requests: write
    # (issue #487, third finding). This job inherits the workflow-level union;
    # the reusable's apply job carries its own job-level `contents: read`
    # downgrade, which is what scopes the token that actually runs.
    uses: ./.github/workflows/terraform-ci-reusable.yml
    with:
      event: push
    secrets: inherit
