name: agent-groom (reusable)

# Reusable workflow — call this from agent-groom.yml (or any external caller)
# to run the grooming agent on a specific issue.
#
# Security: allowlist gating is the caller's responsibility; this reusable
# performs no sender check. Keep the allowlist condition in the caller stub.
#
# External consumers: pass `image` to use a published developer image and
# skip the Docker build, e.g.:
#   image: ghcr.io/mfrancza/agentic-development-workflow/developer:v1
# Leave image empty (the default) to build from the local source tree —
# this repo's own caller stub relies on the default.

on:
  workflow_call:
    inputs:
      issue-number:
        description: 'Issue number to groom'
        required: true
        type: number
      repo:
        description: 'GitHub repository (owner/name), e.g. octocat/my-repo'
        required: true
        type: string
      image:
        description: >
          Pre-built developer image reference to pull and run (e.g.
          ghcr.io/mfrancza/agentic-development-workflow/developer:v1).
          Leave empty (the default) to build the developer image from the
          local source tree — this repo uses this mode.
        required: false
        type: string
        default: ''
      default-model:
        description: 'Default Claude model when no model label is present on the issue'
        required: false
        type: string
        default: ''
      admin-assignees:
        description: >
          ADMIN_ASSIGNEES value forwarded to the agent container (JSON-encoded
          list of GitHub logins, e.g. ["alice","bob"]).
        required: false
        type: string
        default: ''
      logs-retention-days:
        description: 'Days to retain uploaded log artifacts'
        required: false
        type: number
        default: 30
      helpers-ref:
        description: >
          Git ref (tag, branch, or full commit SHA) of
          mfrancza/agentic-development-workflow to check out for helper
          actions. Must not be empty. Repository-owned callers pass
          github.sha; external callers pass the same ref used in the uses:
          selector (e.g. v0, v0.0.2, or a full SHA).
        required: true
        type: string
    secrets:
      DEVELOPER_APP_ID:
        required: true
      DEVELOPER_APP_PRIVATE_KEY:
        required: true
      # LLM API keys are declared required: false so that callers who use only
      # one provider (e.g. Anthropic only) do not need to set placeholder secrets
      # for the other two. The container entrypoint validates at runtime that the
      # key matching the resolved model is present, so an absent key causes a
      # clear runtime error rather than a silent no-op.
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      XAI_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  groom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi

      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false

      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"

      - name: Mint installation token for developer-agent
        id: setup
        uses: ./_agentic-workflow/.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Resolve Claude model from issue labels
        id: model
        uses: ./_agentic-workflow/.github/actions/resolve-model
        with:
          token: ${{ steps.setup.outputs.token }}
          subject-type: issue
          subject-number: ${{ inputs.issue-number }}
          repo: ${{ inputs.repo }}
          default-model: ${{ inputs.default-model }}
          agent-type: groom

      - name: Prepare agent log directory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agent-logs"
          chmod 0777 "${RUNNER_TEMP}/agent-logs"

      - name: Run grooming agent
        uses: ./_agentic-workflow/.github/actions/run-agent
        env:
          ADMIN_ASSIGNEES: ${{ inputs.admin-assignees }}
        with:
          image: ${{ inputs.image }}
          gh-token: ${{ steps.setup.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          repo: ${{ inputs.repo }}
          agent-action: groom
          issue-number: ${{ inputs.issue-number }}
          model: ${{ steps.model.outputs.claude_model }}
          logs-dir: ${{ runner.temp }}/agent-logs

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-groom-issue-${{ inputs.issue-number }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs
          retention-days: ${{ inputs.logs-retention-days }}
          if-no-files-found: warn

      - name: Remove agent:groom label
        if: success()
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          GITHUB_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPO" \
            --remove-label "agent:groom"
