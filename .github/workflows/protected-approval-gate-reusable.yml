name: protected-approval-gate (reusable)

# The caller supplies PR event data explicitly because github.event in a
# reusable workflow contains the workflow_call event, not its caller's event.
on:
  workflow_call:
    inputs:
      protected-pr-author-logins:
        description: JSON array of protected PR author logins.
        required: true
        type: string
      required-approval-count:
        description: Positive number of qualifying approvals required.
        required: true
        type: string
      enabled:
        description: Whether the protected-approval gate is enabled.
        required: true
        type: string
      pr-number:
        description: Pull request number to evaluate.
        required: true
        type: number
      head-sha:
        description: Head SHA from the triggering pull request event.
        required: true
        type: string
      repo:
        description: Repository in owner/name format.
        required: true
        type: string
      helpers-ref:
        description: >
          Git ref of mfrancza/agentic-development-workflow to check out for
          helper actions. Must not be empty.
        required: true
        type: string
      departed-sha:
        description: Optional SHA the triggering pull request departed.
        required: false
        type: string
        default: ''
      departed-pr-number:
        description: Optional pull request number to exclude while reconciling departed-sha.
        required: false
        type: number
        default: 0
      qualifying-reviewers:
        description: >
          JSON array of logins and <org>/<team-slug> references whose
          approvals count toward the threshold (PROTECTED_APPROVAL_REVIEWERS).
          Empty means any reviewer other than the PR author counts.
        required: false
        type: string
        default: ''
    secrets:
      ALLOWLIST_RESOLVER_APP_ID:
        description: >
          Client ID of the allowlist-resolver GitHub App (organization
          Members read). Needed only when qualifying-reviewers contains a
          team reference.
        required: false
      ALLOWLIST_RESOLVER_APP_PRIVATE_KEY:
        description: Private key of the allowlist-resolver GitHub App.
        required: false

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi

      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false

      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"

      # Team references in qualifying-reviewers need organization Members
      # read, which GITHUB_TOKEN lacks. Mint the allowlist-resolver token only
      # when the list has a team reference and the secret is configured. A
      # missing secret or failed mint leaves the token empty, and the activity
      # then fails protected PRs closed with an explanation.
      - name: Detect team references in qualifying reviewers
        id: reviewer-teams
        env:
          QUALIFYING_REVIEWERS: ${{ inputs.qualifying-reviewers }}
          HAS_RESOLVER: ${{ secrets.ALLOWLIST_RESOLVER_APP_ID != '' }}
        run: |
          set -euo pipefail
          teams=false
          if jq -e 'type == "array" and any(.[]; type == "string" and contains("/"))' <<<"${QUALIFYING_REVIEWERS:-[]}" >/dev/null 2>&1; then
            teams=true
          fi
          if [[ "$teams" == "true" && "$HAS_RESOLVER" == "true" ]]; then
            echo 'mint=true' >> "$GITHUB_OUTPUT"
          else
            echo 'mint=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Mint allowlist-resolver token
        id: resolver-token
        if: steps.reviewer-teams.outputs.mint == 'true'
        continue-on-error: true
        uses: ./_agentic-workflow/.github/actions/agent-token
        with:
          client-id: ${{ secrets.ALLOWLIST_RESOLVER_APP_ID }}
          private-key: ${{ secrets.ALLOWLIST_RESOLVER_APP_PRIVATE_KEY }}

      - name: Publish protected-approval-gate check
        uses: ./_agentic-workflow/.github/actions/check-protected-approval-gate
        with:
          protected-pr-author-logins: ${{ inputs.protected-pr-author-logins }}
          required-approval-count: ${{ inputs.required-approval-count }}
          enabled: ${{ inputs.enabled }}
          qualifying-reviewers: ${{ inputs.qualifying-reviewers }}
          resolver-token: ${{ steps.resolver-token.outputs.token }}
          pr-number: ${{ inputs.pr-number }}
          head-sha: ${{ inputs.head-sha }}
          repo: ${{ inputs.repo }}
          departed-sha: ${{ inputs.departed-sha }}
          departed-pr-number: ${{ inputs.departed-pr-number }}
