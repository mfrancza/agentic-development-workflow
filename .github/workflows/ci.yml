name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-and-test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # The Actions runner silently drops env keys containing dashes on run:
      # steps, and @actions/core getInput() only transforms spaces — so an
      # env key like INPUT_SUBJECT-TYPE never reaches the script and the
      # matching getInput("subject-type") fails as "not supplied" at runtime
      # while typecheck and unit tests stay green (first hit live by
      # resolve-model in agent-review). Enforce the underscore convention on
      # both sides of the boundary: INPUT_* env keys in composite actions and
      # getInput() names must never contain dashes.
      - name: Lint activity input plumbing
        working-directory: .
        run: |
          set -euo pipefail
          STATUS=0
          if grep -rnE 'INPUT_[A-Za-z0-9_]*-[A-Za-z0-9_-]*:' .github/actions/*/action.yml; then
            echo "::error::Dashed INPUT_* env key(s) found above — the runner drops them; use underscores."
            STATUS=1
          fi
          if grep -rnE 'getInput\("[^"]*-[^"]*"' .github/scripts/src; then
            echo "::error::Dashed getInput() name(s) found above — use underscores to match INPUT_* env keys."
            STATUS=1
          fi
          exit "$STATUS"

      # Execute every activity entrypoint the same way the composite actions
      # do (tsx, no inputs supplied) and fail on module-resolution errors.
      # tsc --noEmit and vitest both passed while the entrypoints crashed at
      # runtime with ERR_PACKAGE_PATH_NOT_EXPORTED (missing "type": "module"
      # against the ESM-only @actions/core v3) — neither tool loads the code
      # through Node's module resolution the way tsx does. Without inputs the
      # expected outcome is an input-validation error; anything that fails
      # module loading fails this step.
      - name: Smoke-run entrypoints via tsx
        run: |
          set -euo pipefail
          STATUS=0
          for f in src/*.ts; do
            OUT="$(npx --no-install tsx "$f" 2>&1 || true)"
            if printf '%s' "$OUT" | grep -qE 'ERR_PACKAGE_PATH_NOT_EXPORTED|ERR_MODULE_NOT_FOUND|ERR_REQUIRE_ESM|Cannot find module'; then
              echo "::error::${f} failed module loading:"
              printf '%s\n' "$OUT"
              STATUS=1
            else
              echo "${f}: module loading OK"
            fi
          done
          exit "$STATUS"
