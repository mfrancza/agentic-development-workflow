name: Terraform CI (reusable)

# Reusable Terraform CI workflow.
#
# Two jobs — one per triggering mode:
#   plan  (inputs.event == 'pull_request'): fmt-check → validate → plan → post PR comment
#   apply (inputs.event == 'push'):         init → plan → apply -auto-approve
#
# Caller responsibilities:
#   - Use pull_request_target (not pull_request) for the plan trigger so the
#     workflow YAML and local composite actions are always loaded from the base
#     branch (Decision 2, docs/design/terraform-ci.md).
#   - Gate the plan call on github.event.pull_request.head.repo.full_name ==
#     github.repository to exclude fork-headed PRs (same model as agent-review).
#   - Pass secrets: inherit so TF_API_TOKEN and the TERRAFORM_APP_* secrets
#     are available here.
#
# Plan job workspace layout:
#   _base/  — base-branch tip checkout (trusted helper actions and scripts).
#             All composite actions in the plan job are invoked via
#             ./_base/.github/actions/<name> so they are always loaded from
#             base-branch code, even after the PR-head checkout below.
#   _pr/    — PR-head checkout (the Terraform code being reviewed).
#             All Terraform CLI steps and the provider-allowlist gate operate
#             on this tree. working-directory is _pr/terraform throughout.
#
# See docs/design/terraform-ci-plan-checkout-isolation.md for the full
# rationale behind the dual-checkout layout (Decisions 1 and 2).
#
# !! CONSUMER-ONLY — NOT PART OF THE EXTERNALLY PUBLISHED SURFACE IN v0 !!
#
# This workflow is not intended for use by external repositories in v0.  Its
# plan and apply jobs read paths specific to this repo's layout (terraform/,
# .github/actions/, .tool-versions) and target this repo's Terraform GitHub
# App.  External consumers who need Terraform CI should copy the workflow and
# its helpers or build a bespoke one.
#
# See docs/design/reusable-workflow-helper-resolution.md Decision 6 for the
# rationale and the conditions under which this restriction may be revisited.

on:
  workflow_call:
    inputs:
      event:
        description: >
          Triggering event type. Pass "pull_request" to run the plan job;
          pass "push" to run the apply job.
        required: true
        type: string
      pr-number:
        description: >
          Pull request number to post the plan comment on.
          Required when event is "pull_request"; ignored for "push".
        required: false
        type: number
        default: 0
      head-sha:
        description: >
          PR head commit SHA to check out and plan against.
          Required when event is "pull_request"; ignored for "push".
        required: false
        type: string
        default: ''
    secrets:
      TERRAFORM_APP_ID:
        required: true
      TERRAFORM_APP_PRIVATE_KEY:
        required: true
      TF_API_TOKEN:
        required: true

env:
  TF_IN_AUTOMATION: 'true'

jobs:
  # ── Plan job ────────────────────────────────────────────────────────────────
  # Triggered on pull_request_target (caller's responsibility).
  # Runs from the base-branch workflow YAML so a PR cannot modify the workflow
  # code that executes against the terraform-ci token.
  plan:
    name: Terraform plan
    if: inputs.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      # Terraform reads HCP credentials from TF_TOKEN_<hostname> env vars
      # (dots as underscores) — a bare TF_API_TOKEN env var is ignored by the
      # CLI and init fails asking for `terraform login`.
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    steps:
      # Check out the base branch into _base/ so trusted composite actions
      # (./_base/.github/actions/**) are isolated from the PR-head checkout
      # that follows. On pull_request_target the default ref is GITHUB_SHA =
      # current base-branch HEAD (not a merge commit). Every plan-job
      # composite action is invoked via ./_base/.github/actions/<name> so it
      # always loads from trusted base-branch code regardless of what the
      # PR-head checkout contains.
      # See docs/design/terraform-ci-plan-checkout-isolation.md Decision 1.
      - name: Checkout base branch (trusted helper actions)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # No ref: — pull_request_target's default is GITHUB_SHA (base-branch HEAD).
          path: _base
          persist-credentials: false

      - name: Mint terraform-ci App token
        id: token
        uses: ./_base/.github/actions/agent-token
        with:
          client-id: ${{ secrets.TERRAFORM_APP_ID }}
          private-key: ${{ secrets.TERRAFORM_APP_PRIVATE_KEY }}

      # Check out the PR head into _pr/ so Terraform steps run against the
      # PR's changes. Using a separate path keeps the trusted _base/ tree
      # intact and prevents the PR-head content from overwriting the composite
      # actions that run with the minted App token.
      # See docs/design/terraform-ci-plan-checkout-isolation.md Decision 1.
      - name: Checkout PR head (Terraform code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.head-sha }}
          path: _pr
          persist-credentials: false

      # Provider allowlist gate — runs from base-branch workflow YAML so a PR
      # cannot modify the gate that inspects it.  Fails if any provider source
      # in .terraform.lock.hcl or required_providers blocks is not on the
      # explicit allowlist.  Reads from _pr/ (PR-head content) because that is
      # the surface being defended.  See docs/design/terraform-ci.md Decision 2,
      # mitigation 4 and docs/design/terraform-ci-plan-checkout-isolation.md
      # Decision 2 for the full rationale.
      - name: Terraform provider allowlist gate
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import re, sys, pathlib, glob

          # Hardcoded allowlist — lives in the base-branch workflow YAML; a PR
          # under inspection cannot modify this list via pull_request_target.
          ALLOWED = {
              "registry.terraform.io/integrations/github",
              # Short form used in required_providers (Terraform normalises it
              # to the canonical registry.terraform.io/ prefix at init time).
              "integrations/github",
          }

          sources = set()

          # 1. Provider blocks in .terraform.lock.hcl (canonical registry form)
          # Read from _pr/ — this is the PR-head content being inspected.
          lockfile = pathlib.Path("_pr/terraform/.terraform.lock.hcl")
          if lockfile.exists():
              for m in re.finditer(
                  r'^provider\s+"([^"]+)"', lockfile.read_text(), re.MULTILINE
              ):
                  sources.add(m.group(1))

          # 2. source = "..." inside required_providers { } blocks in all .tf files
          # Read from _pr/ — this is the PR-head content being inspected.
          for tf_path in glob.glob("_pr/terraform/**/*.tf", recursive=True):
              content = pathlib.Path(tf_path).read_text()
              for rp_match in re.finditer(
                  r'required_providers\s*\{([^}]*(?:\{[^}]*\}[^}]*)*)\}',
                  content,
                  re.DOTALL,
              ):
                  block = rp_match.group(1)
                  for src_match in re.finditer(r'source\s*=\s*"([^"]+)"', block):
                      sources.add(src_match.group(1))

          violations = sources - ALLOWED
          if violations:
              for v in sorted(violations):
                  print(f"::error::Terraform provider source not on allowlist: {v}")
              sys.exit(1)
          print(f"Provider allowlist gate passed. Sources checked: {sources or '(none)'}")
          PYEOF

      # Read from _pr/.tool-versions (Decision 2) so a PR that bumps the
      # Terraform version is validated with the version it intends to use.
      - name: Read Terraform version from .tool-versions
        run: |
          set -euo pipefail
          TF_VERSION=$(grep '^terraform ' _pr/.tool-versions | awk '{print $2}')
          echo "TF_VERSION=${TF_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        # SHA must match patterns_allowed in module "actions_policy" in terraform/main.tf.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: _pr/terraform
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          terraform init -input=false

      - name: Terraform fmt check
        working-directory: _pr/terraform
        run: |
          set -euo pipefail
          terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: _pr/terraform
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          terraform validate

      - name: Terraform plan
        working-directory: _pr/terraform
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          terraform plan -input=false -out=tfplan

      - name: Show plan as text
        working-directory: _pr/terraform
        run: |
          set -euo pipefail
          terraform show -no-color tfplan > "$GITHUB_WORKSPACE/_pr/terraform/tfplan.txt"

      - name: Post Terraform plan comment
        uses: ./_base/.github/actions/terraform-plan-comment
        with:
          token: ${{ steps.token.outputs.token }}
          repo: ${{ github.repository }}
          pr-number: ${{ inputs.pr-number }}
          plan-file: ${{ github.workspace }}/_pr/terraform/tfplan.txt
          bot-login: "terraform-ci[bot]"

  # ── Apply job ───────────────────────────────────────────────────────────────
  # Triggered on push to main (caller's responsibility).
  # Serialised by a named concurrency group so a second merge that lands while
  # an apply is running queues rather than cancels — a mid-apply cancel leaves
  # the HCP state file locked and requires manual force-unlock.
  apply:
    name: Terraform apply
    if: inputs.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    env:
      # Terraform reads HCP credentials from TF_TOKEN_<hostname> env vars
      # (dots as underscores) — a bare TF_API_TOKEN env var is ignored by the
      # CLI and init fails asking for `terraform login`.
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Mint terraform-ci App token
        id: token
        uses: ./.github/actions/agent-token
        with:
          client-id: ${{ secrets.TERRAFORM_APP_ID }}
          private-key: ${{ secrets.TERRAFORM_APP_PRIVATE_KEY }}

      - name: Read Terraform version from .tool-versions
        run: |
          set -euo pipefail
          TF_VERSION=$(grep '^terraform ' .tool-versions | awk '{print $2}')
          echo "TF_VERSION=${TF_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        # SHA must match patterns_allowed in module "actions_policy" in terraform/main.tf.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          terraform init -input=false

      - name: Terraform plan
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve tfplan
