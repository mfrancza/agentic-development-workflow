name: agent-respond-review

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read   # for check-reviewer-feedback activity (review threads + inline comments)

concurrency:
  group: agent-respond-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond-review:
    # Only respond to submitted reviews on PRs authored by the developer agent
    # AND written by a trusted review author. Both gates are required:
    #
    #   PR-author gate — restricts responses to agent-authored PRs so the
    #     developer agent never spends its Anthropic budget or contents-write
    #     token responding to reviews on human-authored PRs.
    #
    #   Review-author gate — the review body and inline comments are
    #     attacker-controlled text that flows into a Claude prompt with a
    #     contents-write installation token and an Anthropic API key. On a
    #     public repo any GitHub user can submit a review on any PR, so
    #     without this gate an outside user could drive prompt injection and
    #     spend-on-demand against the developer agent. Restrict to
    #     `vars.AGENT_ALLOWLIST` (Terraform-managed) plus the known reviewer
    #     bots that post reviews on agent PRs as part of the normal workflow.
    #     For Copilot the login in the pull_request_review event payload is
    #     `Copilot` — observed empirically as the actor on every
    #     Copilot-triggered run (evidence recorded in PR #182), even though
    #     the REST API renders the same reviews as
    #     `copilot-pull-request-reviewer[bot]`. Both REST-form logins
    #     (`copilot-pull-request-reviewer[bot]` and `github-copilot[bot]`)
    #     are kept defensively in case GitHub changes the payload
    #     representation.
    #
    # The pull_request_review: submitted trigger already excludes pending/draft
    # reviews, so no need to repeat that check here.
    if: >
      github.event.pull_request.user.login == 'mfrancza-developer-agent[bot]' &&
      (
        contains(fromJSON(vars.AGENT_ALLOWLIST), github.event.review.user.login) ||
        github.event.review.user.login == 'mfrancza-reviewer-agent[bot]' ||
        github.event.review.user.login == 'Copilot' ||
        github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' ||
        github.event.review.user.login == 'github-copilot[bot]'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Checkout must precede the local agent-token action: the runner resolves
      # ./.github/actions/* references from the workspace.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # Skip cleanly when there is nothing to respond to.
      # Non-approval states (changes_requested, commented) always proceed — they
      # signal the reviewer wants something changed or opened a discussion.
      # For approved reviews two skip conditions apply, checked in order:
      #   1. Zero unresolved PR review threads (primary check): threads are the
      #      ground truth for outstanding feedback. Skip even when the review
      #      carries body text or inline comments — those are advisory when
      #      nothing remains unresolved. This check runs first so a
      #      summary-carrying clean approval (e.g. "Resolved 3 threads; all
      #      clean.") still skips. On GraphQL errors, falls through to the
      #      bare-approval fallback below rather than failing open.
      #   2. Bare approval (no body, no inline comments): fallback reached only
      #      when the GraphQL call above errored or returned a non-numeric value.
      #      Skip when there is provably nothing to respond to.
      - name: Check for reviewer feedback
        id: feedback
        uses: ./.github/actions/check-reviewer-feedback
        with:
          token: ${{ github.token }}
          review-state: ${{ github.event.review.state }}
          review-body: ${{ github.event.review.body }}
          review-id: ${{ github.event.review.id }}
          pr-number: ${{ github.event.pull_request.number }}
          repo-owner: ${{ github.repository_owner }}
          repo-name: ${{ github.event.repository.name }}

      # Mint only after we've decided to proceed — no installation token for runs we skip.
      - name: Mint installation token for developer-agent
        if: steps.feedback.outputs.proceed == 'true'
        id: setup
        uses: ./.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Prepare agent log directory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agent-logs"
          chmod 0777 "${RUNNER_TEMP}/agent-logs"

      - name: Run agent
        if: steps.feedback.outputs.proceed == 'true'
        uses: ./.github/actions/run-agent
        with:
          gh-token: ${{ steps.setup.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          repo: ${{ github.repository }}
          agent-action: respond-review
          pr-number: ${{ github.event.pull_request.number }}
          model: ${{ vars.DEFAULT_MODEL }}
          logs-dir: ${{ runner.temp }}/agent-logs

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-respond-review-pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs
          retention-days: 30
          if-no-files-found: warn
