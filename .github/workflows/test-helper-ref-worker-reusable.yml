name: test-helper-ref worker (nested reusable fixture)

# This worker is called by test-helper-ref-reusable.yml through the supported
# same-repository `./.github/workflows/...` syntax. Its outputs let the outer
# caller assert that a nested reusable resolved at the requested commit.

on:
  workflow_call:
    inputs:
      helpers-ref:
        description: Commit SHA to resolve in the nested reusable.
        required: true
        type: string
    outputs:
      resolved-sha:
        value: ${{ jobs.verify-helper-ref.outputs.resolved-sha }}
      checkout-head:
        value: ${{ jobs.verify-helper-ref.outputs.checkout-head }}

permissions:
  contents: read

jobs:
  verify-helper-ref:
    name: Bootstrap — validate, resolve, checkout, verify HEAD
    runs-on: ubuntu-latest
    outputs:
      resolved-sha: ${{ steps.resolve-ref.outputs.sha }}
      checkout-head: ${{ steps.verify-head.outputs.sha }}
    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi
          echo "Requested ref: ${HELPERS_REF}"
      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false
      - name: Verify helper checkout HEAD matches resolved SHA
        id: verify-head
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          echo "sha=$(printf '%s' "${actual_sha}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
          echo "Checkout HEAD : ${actual_sha}"
          echo "Resolved SHA  : ${EXPECTED_SHA}"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Bootstrap contract violated."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"
