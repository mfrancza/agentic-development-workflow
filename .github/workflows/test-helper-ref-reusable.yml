name: test-helper-ref (reusable fixture)

# Minimal reusable-workflow runtime fixture for the helpers-ref bootstrap contract
# described in docs/design/helper-checkout-job-workflow-sha-context.md Decision 3.
#
# Exercises a nested same-repository reusable call. The nested worker performs
# the four-step bootstrap (validate → resolve → checkout → verify-HEAD) without
# minting a GitHub App token or invoking any composite action from the
# checked-out tree. The caller (test-helper-ref.yml) passes
# helpers-ref: ${{ github.sha }} and then asserts that the requested ref, the
# GitHub API-resolved SHA, and the _agentic-workflow/ checkout HEAD are all equal.
#
# This fixture is a test of the bootstrap contract itself, not a consumer of the
# helper composite actions. It has no secrets dependency and no agent-container run.
# A green checkout-step conclusion alone is not sufficient evidence; the verify-HEAD
# step and the caller's equality assertion are the actual regression guards.

on:
  workflow_call:
    inputs:
      helpers-ref:
        description: >
          Git ref (tag, branch, or full commit SHA) of
          mfrancza/agentic-development-workflow to resolve, check out, and
          verify. Must not be empty. Repository-owned callers pass
          github.sha; external callers pass the same ref used in the uses:
          selector (e.g. v0, v0.0.2, or a full SHA).
        required: true
        type: string
    outputs:
      resolved-sha:
        description: 'Full 40-character commit SHA that helpers-ref resolved to (GitHub API)'
        value: ${{ jobs.call-worker.outputs.resolved-sha }}
      checkout-head:
        description: 'Actual HEAD SHA of the _agentic-workflow/ checkout (git rev-parse HEAD)'
        value: ${{ jobs.call-worker.outputs.checkout-head }}

permissions:
  contents: read

jobs:
  call-worker:
    name: Nested same-repository reusable worker
    uses: ./.github/workflows/test-helper-ref-worker-reusable.yml
    with:
      helpers-ref: ${{ inputs.helpers-ref }}
