name: Test reusable workflow SHA resolution

# Caller workflow for the in-repo runtime regression test from Decision 5 of
# docs/design/helper-checkout-job-workflow-sha-context.md.
#
# Dispatches test-only-job-workflow-sha-reusable.yml and validates at runtime
# that:
#   - job.workflow_sha resolves to a non-empty SHA inside the reusable.
#   - A helper checkout using that SHA lands on the correct commit.
#
# This complements the static lint in test-reusable-portability.yml (Decision 3)
# by exercising the actual GitHub Actions runtime behaviour that the parent
# design's trust-anchor argument depends on.

on:
  pull_request:
    paths:
      - '.github/workflows/*-reusable.yml'
      - '.github/workflows/test-reusable-workflow-sha.yml'
      - 'docs/design/helper-checkout-job-workflow-sha-context.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-workflow-sha:
    uses: ./.github/workflows/test-only-job-workflow-sha-reusable.yml
    with:
      event_name: ${{ github.event_name }}
