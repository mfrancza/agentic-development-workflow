name: agent-dependabot-alert-issues

on:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: dependabot-alert-issues-${{ github.repository }}
  cancel-in-progress: false

jobs:
  schedule:
    if: vars.ENABLE_DEPENDABOT_ALERT_ISSUES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out scheduled revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Mint reader token
        id: reader
        uses: ./.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEPENDABOT_READER_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_READER_APP_PRIVATE_KEY }}

      - name: Mint developer token
        id: writer
        uses: ./.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Reconcile Dependabot alert issues
        uses: ./.github/actions/schedule-dependabot-alert-issues
        with:
          enabled: ${{ vars.ENABLE_DEPENDABOT_ALERT_ISSUES }}
          max-open-prs: ${{ vars.DEPENDABOT_ALERT_ISSUES_MAX_OPEN_PRS }}
          repo-owner: ${{ github.repository_owner }}
          repo-name: ${{ github.event.repository.name }}
          reader-token: ${{ steps.reader.outputs.token }}
          writer-token: ${{ steps.writer.outputs.token }}
