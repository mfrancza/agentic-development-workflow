name: agent-groom

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: agent-groom-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  groom:
    # Gate on the agent:groom label name and sender allowlist. Triggering on
    # label application (rather than issue open) mirrors agent-implement.yml
    # and lets users control which issues get groomed. The allowlist is managed
    # as a Terraform parameter (vars.AGENT_ALLOWLIST) so usernames are not
    # hardcoded in YAML — run `terraform apply` to update it.
    if: >
      github.event.label.name == 'agent:groom' &&
      github.event.issue.state == 'open' &&
      contains(fromJSON(vars.AGENT_ALLOWLIST), github.event.sender.login)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # Checkout must precede the local agent-token action: the runner resolves
      # ./.github/actions/* references from the workspace.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Mint installation token for developer-agent
        id: setup
        uses: ./.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Resolve Claude model from issue labels
        id: model
        uses: ./.github/actions/resolve-model
        with:
          token: ${{ steps.setup.outputs.token }}
          subject-type: issue
          subject-number: ${{ github.event.issue.number }}
          repo: ${{ github.repository }}
          default-model: ${{ vars.DEFAULT_MODEL }}

      - name: Build agent image
        run: docker build -t agent-developer:ci ./docker

      - name: Run grooming agent
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          AGENT_ACTION: groom
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
          AGENT_MODEL: ${{ steps.model.outputs.claude_model }}
        run: |
          docker run --rm \
            -e GH_TOKEN \
            -e ANTHROPIC_API_KEY \
            -e OPENAI_API_KEY \
            -e GITHUB_REPO \
            -e AGENT_ACTION \
            -e GITHUB_ISSUE_NUMBER \
            -e AGENT_MODEL \
            agent-developer:ci

      - name: Remove agent:groom label
        if: success()
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPO" \
            --remove-label "agent:groom"
