name: agent-groom

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  groom:
    # Gate on the agent:groom label name and sender allowlist. Triggering on
    # label application (rather than issue open) mirrors agent-implement.yml
    # and lets users control which issues get groomed. The allowlist is managed
    # as a Terraform parameter (vars.AGENT_ALLOWLIST) so usernames are not
    # hardcoded in YAML — run `terraform apply` to update it.
    #
    # Security: the reusable's authorize job checks the sender allowlist before
    # it enters its concurrency group. The reusable also owns label routing.
    uses: ./.github/workflows/agent-groom-reusable.yml
    with:
      issue-number: ${{ github.event.issue.number }}
      repo: ${{ github.repository }}
      image: ${{ vars.DEVELOPER_IMAGE }}
      default-model: ${{ vars.DEFAULT_MODEL }}
      admin-assignees: ${{ vars.ADMIN_ASSIGNEES }}
      logs-retention-days: 30
      helpers-ref: ${{ github.sha }}
      sender-login: ${{ github.event.sender.login }}
    secrets:
      DEVELOPER_APP_ID: ${{ secrets.DEVELOPER_APP_ID }}
      DEVELOPER_APP_PRIVATE_KEY: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ALLOWLIST_RESOLVER_APP_ID: ${{ secrets.ALLOWLIST_RESOLVER_APP_ID }}
      ALLOWLIST_RESOLVER_APP_PRIVATE_KEY: ${{ secrets.ALLOWLIST_RESOLVER_APP_PRIVATE_KEY }}
