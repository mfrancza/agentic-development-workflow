name: Test reusable-workflow helper resolution

# Verifies that reusable workflows resolve their helper composite actions from
# the _agentic-workflow/ upstream subdirectory rather than from the caller's
# workspace (./.github/actions/<name>).
#
# This guards against the regression described in Issue #498 where reusable
# workflows used workspace-relative paths that fail for external consumers
# whose workspace does not contain this repo's .github/actions/ tree.
#
# Background: when an external caller invokes
#   uses: mfrancza/agentic-development-workflow/.github/workflows/<name>-reusable.yml@<ref>
# the runner populates $GITHUB_WORKSPACE with the caller's repository — not
# this repo — so any "uses: ./.github/actions/<name>" step would resolve
# against a tree that lacks those actions. The fix (Decision 1 in
# docs/design/reusable-workflow-helper-resolution.md) is a self-checkout into
# a _agentic-workflow/ subdirectory using an explicit, verified helpers-ref
# input; every subsequent step references helpers via
# "./_agentic-workflow/.github/actions/<name>". The checkout ref is governed by
# the helpers-ref input (see docs/design/helper-checkout-job-workflow-sha-context.md
# and AGENTS.md § Known traps for why github.job_workflow_sha is being replaced).
#
# This workflow contains six jobs:
#   reusable-portability-test        — shell simulation of the cross-repo call;
#                                      asserts the _agentic-workflow/ layout resolves
#                                      correctly from an empty caller workspace.
#   static-lint                      — grep scan that fails if any *-reusable.yml
#                                      file contains a "uses: ./.github/actions/"
#                                      reference outside the documented exceptions.
#   static-helpers-ref-contract      — inventory check: every helper-consuming
#                                      reusable workflow must declare helpers-ref
#                                      as a required input.
#   static-ban-disproven-contexts    — grep scan that fails if any workflow YAML
#                                      uses github.job_workflow_sha or
#                                      job.workflow_sha in live expressions.
#   static-caller-sha-pass          — checks that every repository-owned caller stub
#                                      that delegates to a helper-consuming reusable
#                                      passes helpers-ref: ${{ github.sha }}.
#   static-bootstrap-ordering        — checks that the four bootstrap steps appear
#                                      in the correct sequence (validate → resolve →
#                                      checkout → verify-HEAD) in every
#                                      helper-consuming reusable workflow.

on:
  pull_request:
    paths:
      - '.github/workflows/*-reusable.yml'
      - '.github/workflows/agent-*.yml'
      - '.github/workflows/test-helper-ref*.yml'
      - '.github/actions/*/action.yml'
      - '.github/scripts/**'
      - '.github/workflows/test-reusable-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reusable-portability-test:
    name: Verify _agentic-workflow helper resolution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Build a simulated caller workspace that mirrors the runner layout when
      # an external consumer invokes the reusable workflow:
      #
      #   /tmp/simulated-caller-workspace/          ← caller's $GITHUB_WORKSPACE
      #     _agentic-workflow/                      ← created by the self-checkout step
      #       .github/
      #         actions/                            ← helper composite actions
      #         scripts/                            ← shared TypeScript package
      #
      # The caller workspace deliberately has no .github/actions/ at its root,
      # matching the cross-repo scenario this test is designed to catch.
      - name: Build simulated caller workspace with _agentic-workflow layout
        run: |
          set -euo pipefail

          CALLER_WORKSPACE="/tmp/simulated-caller-workspace"
          mkdir -p "$CALLER_WORKSPACE"

          # Populate _agentic-workflow/ as the self-checkout step does in
          # the fixed reusable workflows (path: _agentic-workflow).
          mkdir -p "$CALLER_WORKSPACE/_agentic-workflow/.github"
          cp -r .github/actions "$CALLER_WORKSPACE/_agentic-workflow/.github/"
          cp -r .github/scripts "$CALLER_WORKSPACE/_agentic-workflow/.github/"

          echo "CALLER_WORKSPACE=$CALLER_WORKSPACE" >> "$GITHUB_ENV"
          echo "Built _agentic-workflow/ layout:"
          ls "$CALLER_WORKSPACE/_agentic-workflow/.github/"

      # Key regression guard: the caller workspace must not contain
      # .github/actions/.  If it did, the old broken "uses: ./.github/actions/"
      # pattern would still resolve — masking the regression.
      - name: Assert caller workspace has no .github/actions/ tree
        run: |
          set -euo pipefail
          if [ -d "$CALLER_WORKSPACE/.github/actions" ]; then
            echo "ERROR: test setup incorrect — caller workspace must not have .github/actions/"
            exit 1
          fi
          echo "Confirmed: .github/actions/ absent from caller workspace"

      # Verify that each helper action referenced by the fixed reusable
      # workflows exists at the _agentic-workflow/ path.
      - name: Verify helper actions exist under _agentic-workflow/
        run: |
          set -euo pipefail
          STATUS=0

          # All actions currently referenced as
          #   uses: ./_agentic-workflow/.github/actions/<name>
          # in the fixed *-reusable.yml files must be present here.
          EXPECTED_ACTIONS=(
            agent-token
            apply-unblocked-labels
            check-blockers
            check-draft-label
            check-reviewer-feedback
            dismiss-stale-reviewer-reviews
            filter-agent-pr
            find-conflicted-prs
            find-existing-pr
            find-linked-issue
            find-newly-unblocked
            resolve-deployment
            resolve-model
            resolve-review-threads
            run-agent
          )

          for action in "${EXPECTED_ACTIONS[@]}"; do
            ACTION_YML="$CALLER_WORKSPACE/_agentic-workflow/.github/actions/$action/action.yml"
            if [ -f "$ACTION_YML" ]; then
              echo "OK: $action found at _agentic-workflow/.github/actions/$action/"
            else
              echo "::error::$action missing at _agentic-workflow/ path: $ACTION_YML"
              STATUS=1
            fi
          done

          exit "$STATUS"

      # Simulate the npm ci + tsx run that composite actions perform when
      # invoked via "./_agentic-workflow/.github/actions/<name>".
      #
      # When a reusable workflow step runs:
      #   uses: ./_agentic-workflow/.github/actions/resolve-model
      # GitHub sets GITHUB_ACTION_PATH to:
      #   $GITHUB_WORKSPACE/_agentic-workflow/.github/actions/resolve-model
      # The composite action's "Resolve scripts directory" step then evaluates:
      #   cd "$GITHUB_ACTION_PATH/../../scripts" && pwd
      # which resolves to:
      #   $GITHUB_WORKSPACE/_agentic-workflow/.github/scripts
      #
      # We reproduce that resolution here with CALLER_WORKSPACE as the
      # stand-in for $GITHUB_WORKSPACE.
      - name: Simulate composite-action path resolution from caller workspace
        run: |
          set -euo pipefail

          # Simulate GITHUB_ACTION_PATH as GitHub sets it when the step runs
          # uses: ./_agentic-workflow/.github/actions/resolve-model
          SIMULATED_ACTION_PATH="$CALLER_WORKSPACE/_agentic-workflow/.github/actions/resolve-model"

          # Resolve scripts/ the same way the "Resolve scripts directory" step does:
          #   echo "dir=$(cd "$ACTION_PATH/../../scripts" && pwd)"
          SCRIPTS_DIR="$(cd "$SIMULATED_ACTION_PATH/../../scripts" && pwd)"

          echo "Simulated GITHUB_ACTION_PATH : $SIMULATED_ACTION_PATH"
          echo "Resolved scripts directory   : $SCRIPTS_DIR"

          # Verify key package files exist at the resolved path
          test -f "$SCRIPTS_DIR/package.json"      || { echo "::error::package.json missing at _agentic-workflow/ scripts path"; exit 1; }
          test -f "$SCRIPTS_DIR/package-lock.json" || { echo "::error::package-lock.json missing at _agentic-workflow/ scripts path"; exit 1; }

          # Confirm .github/scripts/ does NOT exist at the caller-workspace root
          # (so the old broken path would fail if a workflow regressed to it).
          cd "$CALLER_WORKSPACE"
          if [ -d ".github/scripts" ]; then
            echo "ERROR: test setup incorrect — caller workspace must not have .github/scripts/"
            exit 1
          fi
          echo "Confirmed: .github/scripts/ absent from caller workspace"

          # Install dependencies the same way composite-action steps do,
          # from the action-path-relative scripts directory.
          npm ci --prefix "$SCRIPTS_DIR"

          # Smoke-run one activity entry-point from the _agentic-workflow/ scripts
          # directory to confirm tsx module resolution works.
          OUT="$(cd "$SCRIPTS_DIR" && npx --no-install tsx src/resolve-model.ts 2>&1 || true)"
          if printf '%s' "$OUT" | grep -qE \
            'ERR_PACKAGE_PATH_NOT_EXPORTED|ERR_MODULE_NOT_FOUND|ERR_REQUIRE_ESM|Cannot find module'; then
            echo "::error::resolve-model.ts failed module loading from _agentic-workflow/ scripts path:"
            printf '%s\n' "$OUT"
            exit 1
          fi
          echo "resolve-model.ts: module loading OK (output: $(printf '%s' "$OUT" | head -1))"

          echo ""
          echo "SUCCESS: npm ci and tsx ran via _agentic-workflow/.github/scripts/"
          echo "         even though the caller workspace has no .github/scripts/"

      # Assert the old workspace-relative path does not resolve.
      # A reusable workflow that regresses to "uses: ./.github/actions/<name>"
      # from a workspace without that tree would fail at job time; this step
      # makes that assertion explicit and catches the regression before the
      # broken file ships.
      - name: Assert old ./.github/actions/ path does not resolve from caller workspace
        run: |
          set -euo pipefail
          cd "$CALLER_WORKSPACE"

          if [ -d ".github/actions/resolve-model" ]; then
            echo "::error::Regression guard tripped — caller workspace unexpectedly contains .github/actions/resolve-model"
            echo "         The old broken path would still work; test setup is incorrect."
            exit 1
          fi
          echo "Confirmed: .github/actions/ absent — a regression to the old path would fail"
          echo "           The _agentic-workflow/ path is the only valid helper resolution."

  static-lint:
    name: Static lint — no ./.github/actions/ refs in reusable workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Scan every *-reusable.yml file for "uses: ./.github/actions/" references.
      #
      # Documented exceptions (may retain ./.github/actions/ references):
      #   terraform-ci-reusable.yml — declared consumer-only (Decision 6 in
      #     docs/design/reusable-workflow-helper-resolution.md); its steps are
      #     scoped to this repo's Terraform layout and not intended for external
      #     callers.
      #
      # All other *-reusable.yml files must use "./_agentic-workflow/.github/actions/"
      # exclusively so that external callers whose workspace does not contain
      # this repo's .github/actions/ tree can run the workflow successfully.
      - name: Fail if any reusable workflow uses ./.github/actions/ outside documented exceptions
        run: |
          set -euo pipefail
          STATUS=0

          for f in .github/workflows/*-reusable.yml; do
            base="$(basename "$f")"

            # Documented exception: terraform-ci-reusable.yml is consumer-only.
            if [ "$base" = "terraform-ci-reusable.yml" ]; then
              echo "SKIP (documented exception): $f"
              continue
            fi

            # Search for lines matching:  uses: ./.github/actions/
            if grep -nE 'uses: \.\/\.github\/actions\/' "$f"; then
              echo "::error::${f}: contains 'uses: ./.github/actions/' — reusable workflows must use './_agentic-workflow/.github/actions/' so they work from an external caller's workspace. See docs/design/reusable-workflow-helper-resolution.md"
              STATUS=1
            else
              echo "OK: $f"
            fi
          done

          exit "$STATUS"

  static-helpers-ref-contract:
    name: Static inventory — helpers-ref required input on every helper-consuming reusable
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Verify that every helper-consuming reusable workflow declares helpers-ref
      # as a required input.  This is the version-pinning contract documented in
      # docs/design/helper-checkout-job-workflow-sha-context.md Decision 1:
      # callers must explicitly supply the ref; a missing or empty input triggers
      # fail-loud validation rather than an uncontrolled fallback.
      #
      # Non-helper-consuming exceptions (no bootstrap; external-consumer patterns
      # do not apply):
      #   ci-reusable.yml            — runs tsc + vitest; no local composite actions
      #   secret-scan-reusable.yml   — runs gitleaks; no local composite actions
      #   agent-pr-merged-reusable.yml — no checkout; permanent security exception
      #   terraform-ci-reusable.yml  — consumer-only; scoped to this repo's Terraform
      - name: Fail if any helper-consuming reusable is missing helpers-ref with required:true
        run: |
          set -euo pipefail
          STATUS=0

          # Reusable workflows that do NOT use the helpers-ref bootstrap.
          NO_BOOTSTRAP_EXCEPTIONS=(
            "ci-reusable.yml"
            "secret-scan-reusable.yml"
            "agent-pr-merged-reusable.yml"
            "terraform-ci-reusable.yml"
          )

          for f in .github/workflows/*-reusable.yml; do
            base="$(basename "$f")"

            is_exception=false
            for ex in "${NO_BOOTSTRAP_EXCEPTIONS[@]}"; do
              if [[ "$base" == "$ex" ]]; then
                is_exception=true
                break
              fi
            done

            if "$is_exception"; then
              echo "SKIP (no-bootstrap exception): $f"
              continue
            fi

            # Check 1: helpers-ref: key exists as an input declaration.
            # The input key ends with ':' and no other value on the same line,
            # unlike env references such as HELPERS_REF: ${{ inputs.helpers-ref }}.
            if ! grep -qE '^\s+helpers-ref:\s*$' "$f"; then
              echo "::error::${f}: missing helpers-ref input declaration. Every helper-consuming reusable workflow must declare helpers-ref as an input."
              STATUS=1
              continue
            fi

            # Check 2: required: true appears within 20 lines after the
            # helpers-ref: key (covers the description block + property lines).
            helpers_ref_line="$(grep -nE '^\s+helpers-ref:\s*$' "$f" | head -1 | cut -d: -f1)"
            if ! awk -v start="$helpers_ref_line" 'NR>start && NR<=start+20 {print}' "$f" \
                 | grep -q 'required: true'; then
              echo "::error::${f}: helpers-ref input exists but 'required: true' not found in its declaration block."
              STATUS=1
              continue
            fi

            echo "OK: $f — helpers-ref declared with required: true"
          done

          exit "$STATUS"

  static-ban-disproven-contexts:
    name: Static lint — ban github.job_workflow_sha and job.workflow_sha expressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Grep all workflow YAML files for live ${{ ... }} expressions that use the
      # two disproven context forms documented in AGENTS.md § Known traps:
      #
      #   github.job_workflow_sha — GitHub defines this property but runtime evidence
      #     (run 34303371563) shows it evaluated to an empty string; actions/checkout
      #     silently fell back to main. The expression has been retired and replaced
      #     by the helpers-ref input pattern.
      #
      #   job.workflow_sha — does not exist. The 'job' context exposes only
      #     container, services, and status. Using it invalidates the reusable
      #     workflow at parse time, causing zero-job failure runs (PRs #522–#525).
      #
      # Matching on ${{ ... <pattern> }} ensures comment lines (which lack ${{)
      # are not flagged; the check targets live expression uses only.
      - name: Fail if any workflow uses github.job_workflow_sha or job.workflow_sha in an expression
        run: |
          set -euo pipefail
          STATUS=0

          for f in .github/workflows/*.yml; do
            # Skip this file: the error messages below contain the banned literal
            # patterns (e.g. github.job_workflow_sha) and would self-flag the scan.
            if [[ "$f" == ".github/workflows/test-reusable-portability.yml" ]]; then
              echo "SKIP (self: literal patterns appear in error messages): $f"
              continue
            fi

            # github.job_workflow_sha — retired; evaluated empty at runtime
            if grep -nE '\$\{\{[^}]*github\.job_workflow_sha' "$f"; then
              echo "::error::${f}: uses github.job_workflow_sha in an expression — this context evaluated to an empty string at runtime (see AGENTS.md § Known traps). Use the helpers-ref input pattern instead."
              STATUS=1
            fi

            # job.workflow_sha — does not exist; invalidates the workflow at parse time
            if grep -nE '\$\{\{[^}]*job\.workflow_sha' "$f"; then
              echo "::error::${f}: uses job.workflow_sha in an expression — this property does not exist (see AGENTS.md § Known traps). Use the helpers-ref input pattern instead."
              STATUS=1
            fi
          done

          if [[ "$STATUS" -eq 0 ]]; then
            echo "OK: no workflow files use github.job_workflow_sha or job.workflow_sha in expressions"
          fi

          exit "$STATUS"

  static-caller-sha-pass:
    name: Static inventory — caller stubs must pass helpers-ref github.sha
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Verify that every repository-owned caller stub that delegates to a
      # helper-consuming reusable workflow passes helpers-ref: ${{ github.sha }}.
      #
      # Decision 1 in docs/design/helper-checkout-job-workflow-sha-context.md:
      # "Every repository-owned caller passes: helpers-ref: ${{ github.sha }}"
      # This ensures helpers and the calling workflow always run at the same commit.
      - name: Fail if any caller stub does not pass helpers-ref github.sha
        run: |
          set -euo pipefail
          STATUS=0

          # Caller stubs that delegate to helper-consuming reusable workflows.
          # Each must contain helpers-ref: ${{ github.sha }} in its with: block.
          CALLER_STUBS=(
            ".github/workflows/agent-auto-trigger.yml"
            ".github/workflows/agent-design.yml"
            ".github/workflows/agent-fix-checks.yml"
            ".github/workflows/agent-fix-deployment.yml"
            ".github/workflows/agent-groom.yml"
            ".github/workflows/agent-implement.yml"
            ".github/workflows/agent-resolve-conflicts.yml"
            ".github/workflows/agent-respond-review.yml"
            ".github/workflows/agent-review.yml"
            ".github/workflows/test-helper-ref.yml"
          )

          for f in "${CALLER_STUBS[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::${f}: file not found — add it to the CALLER_STUBS list or remove it if deleted."
              STATUS=1
              continue
            fi

            # Build the search string in two fragments so GitHub Actions does not
            # pre-evaluate the ${{ }} token before bash runs the script.
            NEEDLE='helpers-ref: $'
            NEEDLE+='{{ github.sha }}'
            if ! grep -qF "$NEEDLE" "$f"; then
              echo "::error::${f}: does not pass 'helpers-ref: \${{ github.sha }}'. Repository-owned callers must pass the current commit SHA so helpers and the calling workflow run at the same commit."
              STATUS=1
            else
              echo "OK: $f — passes helpers-ref: \${{ github.sha }}"
            fi
          done

          exit "$STATUS"

  static-bootstrap-ordering:
    name: Static inventory — bootstrap steps in correct order in every helper-consuming reusable
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Verify that the four bootstrap steps appear in the required order in every
      # helper-consuming reusable workflow:
      #   1. Validate helpers-ref input
      #   2. Resolve helpers-ref to commit SHA
      #   3. Check out upstream helper actions
      #   4. Verify helper checkout HEAD matches resolved SHA
      #
      # This guards against accidental reordering that would break the security
      # property: the checkout must use the resolved SHA (not the symbolic input),
      # and the HEAD comparison must run after the checkout, not before.
      # See docs/design/helper-checkout-job-workflow-sha-context.md Decision 2.
      - name: Fail if any helper-consuming reusable has bootstrap steps out of order
        run: |
          set -euo pipefail
          STATUS=0

          # Reusable workflows that do NOT use the helpers-ref bootstrap.
          NO_BOOTSTRAP_EXCEPTIONS=(
            "ci-reusable.yml"
            "secret-scan-reusable.yml"
            "agent-pr-merged-reusable.yml"
            "terraform-ci-reusable.yml"
          )

          for f in .github/workflows/*-reusable.yml; do
            base="$(basename "$f")"

            is_exception=false
            for ex in "${NO_BOOTSTRAP_EXCEPTIONS[@]}"; do
              if [[ "$base" == "$ex" ]]; then
                is_exception=true
                break
              fi
            done

            if "$is_exception"; then
              echo "SKIP (no-bootstrap exception): $f"
              continue
            fi

            # Get the line number of the FIRST occurrence of each bootstrap step name.
            # For files with multiple jobs (e.g. agent-auto-trigger-reusable.yml),
            # the first occurrence is in the first helper-consuming job, which is
            # sufficient to verify ordering.
            validate_line="$(grep -n 'name: Validate helpers-ref input' "$f" | head -1 | cut -d: -f1)"
            resolve_line="$(grep -n 'name: Resolve helpers-ref to commit SHA' "$f" | head -1 | cut -d: -f1)"
            checkout_line="$(grep -n 'name: Check out upstream helper actions' "$f" | head -1 | cut -d: -f1)"
            verify_line="$(grep -n 'name: Verify helper checkout HEAD matches resolved SHA' "$f" | head -1 | cut -d: -f1)"

            # All four steps must be present.
            if [[ -z "$validate_line" || -z "$resolve_line" || -z "$checkout_line" || -z "$verify_line" ]]; then
              echo "::error::${f}: one or more bootstrap steps are missing."
              [[ -z "$validate_line" ]]  && echo "  Missing: 'name: Validate helpers-ref input'"
              [[ -z "$resolve_line" ]]   && echo "  Missing: 'name: Resolve helpers-ref to commit SHA'"
              [[ -z "$checkout_line" ]]  && echo "  Missing: 'name: Check out upstream helper actions'"
              [[ -z "$verify_line" ]]    && echo "  Missing: 'name: Verify helper checkout HEAD matches resolved SHA'"
              STATUS=1
              continue
            fi

            # Steps must appear in strict order: validate < resolve < checkout < verify.
            ordering_ok=true
            if [[ "$validate_line" -ge "$resolve_line" ]]; then
              echo "::error::${f}: 'Validate helpers-ref input' (line ${validate_line}) must appear before 'Resolve helpers-ref to commit SHA' (line ${resolve_line})."
              ordering_ok=false
            fi
            if [[ "$resolve_line" -ge "$checkout_line" ]]; then
              echo "::error::${f}: 'Resolve helpers-ref to commit SHA' (line ${resolve_line}) must appear before 'Check out upstream helper actions' (line ${checkout_line})."
              ordering_ok=false
            fi
            if [[ "$checkout_line" -ge "$verify_line" ]]; then
              echo "::error::${f}: 'Check out upstream helper actions' (line ${checkout_line}) must appear before 'Verify helper checkout HEAD matches resolved SHA' (line ${verify_line})."
              ordering_ok=false
            fi

            if "$ordering_ok"; then
              echo "OK: $f — bootstrap ordering correct (validate@${validate_line} < resolve@${resolve_line} < checkout@${checkout_line} < verify@${verify_line})"
            else
              STATUS=1
            fi
          done

          exit "$STATUS"
