name: agent-resolve-conflicts

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to resolve (skips conflict-filter enumeration and runs directly)'
        required: false

permissions:
  contents: read
  pull-requests: read  # for PR enumeration and mergeability polling in find-conflicted-prs

jobs:
  resolve-conflicts:
    uses: ./.github/workflows/agent-resolve-conflicts-reusable.yml
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      escalation-assignee: ${{ github.repository_owner }}
      image: ''
      helpers-ref: ${{ github.sha }}
    secrets:
      DEVELOPER_APP_ID:          ${{ secrets.DEVELOPER_APP_ID }}
      DEVELOPER_APP_PRIVATE_KEY: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY:               ${{ secrets.XAI_API_KEY }}
