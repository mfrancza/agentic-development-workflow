name: agent-resolve-conflicts

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to resolve (skips conflict-filter enumeration and runs directly)'
        required: false

permissions:
  contents: read
  pull-requests: read  # for gh pr list / gh pr view in find-conflicted-prs

jobs:
  find-conflicted-prs:
    runs-on: ubuntu-24.04
    outputs:
      conflicted_prs: ${{ steps.find.outputs.conflicted_prs }}

    steps:
      # When a PR number is provided via workflow_dispatch, use it directly
      # (poll for mergeability state to let GitHub's async computation settle,
      # then include regardless of result — this is a manual backstop).
      # Otherwise enumerate open developer-agent PRs and filter to those that
      # are CONFLICTING (mergeability is computed asynchronously by GitHub after
      # a push; retry with exponential backoff until it settles).
      - name: Find conflicted agent-authored PRs
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PR_INPUT: ${{ inputs.pr_number }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MANUAL_PR="$(echo "${MANUAL_PR_INPUT:-}" | tr -d '\r\n')"
          if [ -n "${MANUAL_PR}" ]; then
            [[ "${MANUAL_PR}" =~ ^[0-9]+$ ]] || { echo "::error::pr_number must be a positive integer; got '${MANUAL_PR}'" >&2; exit 1; }
            echo "Manual dispatch: polling PR #${MANUAL_PR} for mergeability"
            DELAYS=(5 10 20 40 80)
            MERGEABLE="UNKNOWN"
            for i in "${!DELAYS[@]}"; do
              attempt=$(( i + 1 ))
              MERGEABLE="$(gh pr view "${MANUAL_PR}" \
                --repo "$GITHUB_REPO" \
                --json mergeable \
                --jq '.mergeable' 2>/dev/null || echo "UNKNOWN")"
              if [ "$MERGEABLE" != "UNKNOWN" ]; then
                break
              fi
              echo "PR #${MANUAL_PR} mergeability UNKNOWN (attempt ${attempt}/5); waiting ${DELAYS[$i]}s..."
              sleep "${DELAYS[$i]}"
            done
            echo "PR #${MANUAL_PR} mergeability: ${MERGEABLE} (manual dispatch — including regardless)"
            echo "conflicted_prs=[${MANUAL_PR}]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Enumerate all open PRs authored by the developer agent.
          PR_NUMBERS="$(gh pr list \
            --repo "$GITHUB_REPO" \
            --author 'app/mfrancza-developer-agent' \
            --state open \
            --json number \
            --jq '.[].number')"

          if [ -z "$PR_NUMBERS" ]; then
            echo "No open developer-agent PRs found."
            echo "conflicted_prs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Open developer-agent PRs: $(echo "$PR_NUMBERS" | tr '\n' ' ')"

          CONFLICTED_PRS="[]"
          DELAYS=(5 10 20 40 80)
          for PR_NUM in $PR_NUMBERS; do
            # GitHub computes mergeability asynchronously after a push; poll
            # with exponential backoff until the value is no longer UNKNOWN.
            MERGEABLE="UNKNOWN"
            for i in "${!DELAYS[@]}"; do
              attempt=$(( i + 1 ))
              MERGEABLE="$(gh pr view "$PR_NUM" \
                --repo "$GITHUB_REPO" \
                --json mergeable \
                --jq '.mergeable' 2>/dev/null || echo "UNKNOWN")"
              if [ "$MERGEABLE" != "UNKNOWN" ]; then
                break
              fi
              echo "PR #${PR_NUM} mergeability UNKNOWN (attempt ${attempt}/5); waiting ${DELAYS[$i]}s..."
              sleep "${DELAYS[$i]}"
            done

            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "PR #${PR_NUM} is CONFLICTING — queued for resolution"
              CONFLICTED_PRS="$(echo "$CONFLICTED_PRS" | jq ". + [$PR_NUM]")"
            else
              echo "PR #${PR_NUM} mergeability: ${MERGEABLE} — skipping"
            fi
          done

          echo "Conflicted PRs: ${CONFLICTED_PRS}"
          echo "conflicted_prs=${CONFLICTED_PRS}" >> "$GITHUB_OUTPUT"

  resolve:
    needs: find-conflicted-prs
    if: needs.find-conflicted-prs.outputs.conflicted_prs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        pr_number: ${{ fromJSON(needs.find-conflicted-prs.outputs.conflicted_prs) }}
      fail-fast: false
    concurrency:
      group: agent-resolve-conflicts-pr-${{ matrix.pr_number }}
      cancel-in-progress: false

    steps:
      # Checkout must precede the local agent-token action: the runner resolves
      # ./.github/actions/* references from the workspace.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Mint installation token for developer-agent
        id: setup
        uses: ./.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Build agent image
        run: docker build -t agent-developer:ci ./docker

      - name: Run agent
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          AGENT_ACTION: resolve-conflicts
          GITHUB_PR_NUMBER: ${{ matrix.pr_number }}
          AGENT_MODEL: ${{ vars.DEFAULT_MODEL }}
          ESCALATION_ASSIGNEE: ${{ github.repository_owner }}
        run: |
          docker run --rm \
            -e GH_TOKEN \
            -e ANTHROPIC_API_KEY \
            -e OPENAI_API_KEY \
            -e GITHUB_REPO \
            -e AGENT_ACTION \
            -e GITHUB_PR_NUMBER \
            -e AGENT_MODEL \
            -e ESCALATION_ASSIGNEE \
            agent-developer:ci
