name: agent-resolve-conflicts (reusable)

# Reusable workflow extracted from agent-resolve-conflicts.yml.
# Callers supply the push/workflow_dispatch triggers; this workflow
# finds conflicted agent-authored PRs and resolves them via a matrix run.
#
# External consumers: this workflow self-checks out helper actions into
# _agentic-workflow/ before any composite-action step runs. The checkout ref
# is the resolved helpers-ref input (see docs/design/helper-checkout-job-workflow-sha-context.md
# and AGENTS.md § Known traps). No checkout of the caller workspace is performed.

on:
  workflow_call:
    inputs:
      pr-number:
        description: >
          PR number to resolve directly (skips the conflict-filter
          enumeration and runs the agent on this PR only). Pass the empty
          string (default) to enumerate all conflicted agent-authored PRs.
          Corresponds to the workflow_dispatch input in the caller.
        type: string
        required: false
        default: ''
      sender-login:
        description: 'Login requesting on-demand resolution; empty for trusted push and dispatch callers.'
        type: string
        required: false
        default: ''
      developer-author:
        description: >
          GitHub App slug in `app/<slug>` form used to filter open PRs by the
          developer-agent identity during enumeration (e.g.
          `app/my-developer-agent`). Ignored when pr-number is set (enumeration
          is skipped). Defaults to `app/mfrancza-developer-agent` — external
          adopters must override this to match their own developer-agent App slug.
        type: string
        required: false
        default: 'app/mfrancza-developer-agent'
      author-allowlist:
        description: >
          JSON array of GitHub logins whose open PRs are swept for merge
          conflicts. Empty array (the default) preserves the existing
          agent-only behavior. Use ["*"] to sweep every author; use
          ["alice", "bob"] to sweep the developer-agent plus those logins.
          Cross-repository (fork-headed) PRs are always excluded. Corresponds
          to the RESOLVE_CONFLICTS_AUTHOR_ALLOWLIST repository variable set by
          Terraform. Ignored when pr-number is set (enumeration is skipped).
        type: string
        required: false
        default: '[]'
      escalation-assignee:
        description: >
          GitHub login to assign escalation issues to (e.g.
          github.repository_owner). Injected as ESCALATION_ASSIGNEE in the
          agent container.
        type: string
        required: true
      image:
        description: >
          Pre-built agent image reference to pull (e.g.
          ghcr.io/owner/repo/developer:v1). Leave empty (default) to build
          from the local Docker build context instead — the mode used by
          this repository's self-hosted runs.
        type: string
        required: false
        default: ''
      helpers-ref:
        description: >
          Git ref (tag, branch, or full commit SHA) of
          mfrancza/agentic-development-workflow to check out for helper
          actions. Must not be empty. Repository-owned callers pass
          github.sha; external callers pass the same ref used in the uses:
          selector (e.g. v0, v0.0.2, or a full SHA).
        required: true
        type: string
    secrets:
      DEVELOPER_APP_ID:
        required: true
      DEVELOPER_APP_PRIVATE_KEY:
        required: true
      # LLM API keys are declared required: false so that callers who use only
      # one provider (e.g. Anthropic only) do not need to set placeholder secrets
      # for the other two. The container entrypoint validates at runtime that the
      # key matching the resolved model is present, so an absent key causes a
      # clear runtime error rather than a silent no-op.
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      XAI_API_KEY:
        required: false
      ALLOWLIST_RESOLVER_APP_ID: { required: false }
      ALLOWLIST_RESOLVER_APP_PRIVATE_KEY: { required: false }

permissions:
  contents: read
  pull-requests: read  # for PR enumeration and mergeability polling in find-conflicted-prs

jobs:
  state-gate:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      proceed: ${{ steps.state.outputs.proceed }}
    steps:
      - name: Check PR state for on-demand resolution
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          SENDER: ${{ inputs.sender-login }}
        run: |
          set -euo pipefail
          if [[ -z "$SENDER" ]]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::On-demand resolution requires a valid PR number.'
            exit 1
          fi
          state="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.state')"
          if [[ "$state" != open ]]; then
            echo "::notice::PR #$PR_NUMBER is not open; skipping resolution."
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          fi

  authorize:
    needs: state-gate
    if: needs.state-gate.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi

      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false
      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Helper checkout HEAD ($actual_sha) does not match the resolved SHA ($EXPECTED_SHA)."
            exit 1
          fi
      - name: Detect team references
        id: detect
        env:
          ALLOWLIST: ${{ vars.AGENT_ALLOWLIST }}
          SENDER: ${{ inputs.sender-login }}
        run: |
          set -euo pipefail
          has=false
          if [[ -n "$SENDER" && -n "$ALLOWLIST" ]] && jq -e 'any(.[]; type == "string" and contains("/"))' <<< "$ALLOWLIST" >/dev/null; then
            has=true
          fi
          echo "needs_resolver=$has" >> "$GITHUB_OUTPUT"
      - name: Mint installation token for allowlist resolver
        id: allowlist-resolver
        if: steps.detect.outputs.needs_resolver == 'true'
        continue-on-error: true
        uses: ./_agentic-workflow/.github/actions/agent-token
        with:
          client-id: ${{ secrets.ALLOWLIST_RESOLVER_APP_ID }}
          private-key: ${{ secrets.ALLOWLIST_RESOLVER_APP_PRIVATE_KEY }}
      - name: Check agent allowlist
        uses: ./_agentic-workflow/.github/actions/check-agent-allowlist
        with:
          allowlist: ${{ vars.AGENT_ALLOWLIST }}
          principal: ${{ inputs.sender-login }}
          skip-gate: ${{ inputs.sender-login == '' }}
          resolver-token: ${{ steps.allowlist-resolver.outputs.token }}

  find-conflicted-prs:
    needs: [state-gate, authorize]
    if: needs.state-gate.outputs.proceed == 'true' && needs.authorize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      conflicted_prs: ${{ steps.find.outputs.conflicted_prs }}

    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi

      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false

      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"

      # When a PR number is provided via workflow_dispatch, use it directly
      # (poll for mergeability state to let GitHub's async computation settle,
      # then include regardless of result — this is a manual backstop).
      # Otherwise enumerate open developer-agent PRs and filter to those that
      # are CONFLICTING (mergeability is computed asynchronously by GitHub after
      # a push; retry with exponential backoff until it settles).
      - name: Find conflicted agent-authored PRs
        id: find
        uses: ./_agentic-workflow/.github/actions/find-conflicted-prs
        with:
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr-number: ${{ inputs.pr-number }}
          author: ${{ inputs.developer-author }}
          author-allowlist: ${{ inputs.author-allowlist }}

  resolve:
    needs: find-conflicted-prs
    if: needs.find-conflicted-prs.outputs.conflicted_prs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        pr_number: ${{ fromJSON(needs.find-conflicted-prs.outputs.conflicted_prs) }}
      fail-fast: false
    concurrency:
      group: agent-branch-pr-${{ matrix.pr_number }}
      cancel-in-progress: false

    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi

      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false

      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"

      - name: Mint installation token for developer-agent
        id: setup
        uses: ./_agentic-workflow/.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Clear prior conflict escalation
        if: inputs.sender-login != ''
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
          COMMENT_BODY: 'Operator re-attempted resolution via `agent:resolve-conflicts`; prior escalation marker removed.'
        run: |
          set -euo pipefail
          labels="$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name')"
          if printf '%s\n' "$labels" | grep -Fxq 'conflicts-escalated'; then
            gh api --method DELETE "repos/$REPO/issues/$PR_NUMBER/labels/conflicts-escalated"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$COMMENT_BODY"
          fi

      - name: Prepare agent log directory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agent-logs"
          chmod 0777 "${RUNNER_TEMP}/agent-logs"

      - name: Run agent
        uses: ./_agentic-workflow/.github/actions/run-agent
        with:
          image: ${{ inputs.image }}
          gh-token: ${{ steps.setup.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          repo: ${{ github.repository }}
          agent-action: resolve-conflicts
          pr-number: ${{ matrix.pr_number }}
          model: ${{ vars.DEFAULT_MODEL }}
          escalation-assignee: ${{ inputs.escalation-assignee }}
          logs-dir: ${{ runner.temp }}/agent-logs

      - name: Remove on-demand trigger label
        if: success() && inputs.sender-login != ''
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set -euo pipefail
          if ! result="$(gh api --method DELETE "repos/$REPO/issues/$PR_NUMBER/labels/agent%3Aresolve-conflicts" 2>&1)"; then
            printf '%s\n' "$result" >&2
            if [[ "$result" != *'(HTTP 404)'* ]]; then
              exit 1
            fi
            labels="$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name')"
            if printf '%s\n' "$labels" | grep -Fxq 'agent:resolve-conflicts'; then
              echo '::error::Trigger label is still present after the failed removal.'
              exit 1
            fi
            echo '::notice::Trigger label was already removed.'
          fi

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-resolve-conflicts-pr-${{ matrix.pr_number }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs
          retention-days: 30
          if-no-files-found: warn
