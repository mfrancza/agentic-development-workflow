name: protected-approval-gate-sweep (reusable)

# Reruns the publisher workflow for every open pull request so each PR's
# auto-emitted protected-approval-gate check reflects the current approval state.
# Called by the backfill (dispatched after the gate is enabled) and reconcile
# (scheduled safety net) caller stubs, in this repo and in adopting repos.
on:
  workflow_call:
    inputs:
      repo:
        description: Repository in owner/name format.
        required: true
        type: string
      interval-minutes:
        description: >
          Minimum minutes between sweeps when the caller was triggered by
          schedule (ENABLE_PROTECTED_APPROVAL_GATE_RECONCILE_MINUTES). Empty
          means 10. Ignored for other trigger events, so a dispatched
          backfill always sweeps.
        required: false
        type: string
        default: ''
      publisher-workflow-file:
        description: >
          Filename of the publisher workflow. Adopters who copy the publisher
          under a different name must set this input.
        required: false
        type: string
        default: 'protected-approval-gate-publisher.yml'

# actions: write is required to call POST /actions/runs/{run_id}/rerun.
# actions: read is required for the interval guard's prior-run lookup.
permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  find-open-prs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.interval.outputs.run }}
      prs: ${{ steps.prs.outputs.value }}
    steps:
      - id: interval
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.interval-minutes }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          minutes="${MINUTES:-10}"
          if ! [[ "$minutes" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::interval-minutes (ENABLE_PROTECTED_APPROVAL_GATE_RECONCILE_MINUTES) must be a positive integer."
            exit 1
          fi
          # The cron fires at most every 5 minutes; skip unless the caller workflow's last
          # successful run is at least `minutes` old.
          workflow_file="${GITHUB_WORKFLOW_REF%@*}"
          workflow_file="${workflow_file##*/}"
          if completed="$(gh api "repos/${REPO}/actions/workflows/${workflow_file}/runs?status=success&per_page=10" 2>/dev/null)"; then
            previous="$(jq -r --arg id "$GITHUB_RUN_ID" '[.workflow_runs[] | select((.id | tostring) != $id) | .updated_at] | max // empty' <<<"$completed")"
            if [[ -n "$previous" ]] && (( $(date +%s) - $(date -d "$previous" +%s) < minutes * 60 )); then
              echo 'run=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "::warning::Could not read prior runs of ${workflow_file}; continuing with a full sweep."
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
      - id: prs
        if: steps.interval.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          # No SHA deduplication: each PR has its own publisher run to rerun.
          # (SHA deduplication was needed under the old Checks API per-SHA model;
          # the rerun model is per-PR and does not share writes across PRs.)
          prs="$(gh pr list --repo "$REPO" --state open --limit 1000 --json number | jq -c 'map({number})')"
          echo "value=${prs}" >> "$GITHUB_OUTPUT"

  rerun:
    needs: find-open-prs
    if: needs.find-open-prs.outputs.run == 'true' && needs.find-open-prs.outputs.prs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.find-open-prs.outputs.prs) }}
    steps:
      - name: Find and rerun latest publisher run for PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr.number }}
          REPO: ${{ inputs.repo }}
          PUBLISHER_WORKFLOW: ${{ inputs.publisher-workflow-file }}
        run: |
          set -euo pipefail
          run_id="$(gh api \
            "repos/${REPO}/actions/workflows/${PUBLISHER_WORKFLOW}/runs?event=pull_request_target&per_page=100" \
            | jq -r --argjson pr "${PR_NUMBER}" \
              '[.workflow_runs[] | select((.pull_requests // [])[] | .number == $pr) | .id] | .[0] // ""')"
          if [[ -z "$run_id" ]]; then
            echo "::warning::No prior pull_request_target publisher run found for PR #${PR_NUMBER}. Push a no-op commit to create one: gh pr checkout ${PR_NUMBER} && git commit --allow-empty -m 'trigger publisher run' && git push"
            exit 0
          fi
          echo "Triggering rerun of publisher run ${run_id} for PR #${PR_NUMBER}."
          gh api -X POST "repos/${REPO}/actions/runs/${run_id}/rerun"
          echo "Rerun triggered successfully for PR #${PR_NUMBER}."
