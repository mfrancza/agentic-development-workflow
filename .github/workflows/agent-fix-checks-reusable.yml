name: agent-fix-checks (reusable)

# Reusable workflow extracted from agent-fix-checks.yml.
# Callers supply the workflow_run trigger, the failure/PR conditions, and
# the concurrency group; this workflow performs the actual trust-gate check,
# token minting, and agent run.
#
# NOTE on github.event in reusable workflows: within a reusable workflow
# github.event is the workflow_call event payload, not the calling workflow's
# original event. All event data that steps need must therefore be passed
# as explicit inputs: see the with: block in agent-fix-checks.yml.
#
# External consumers: this workflow self-checks out the helper actions at
# job.workflow_sha (the SHA the caller pinned to) into _agentic-workflow/,
# so no checkout of the caller's workspace is needed or performed.

on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Pull request number (github.event.workflow_run.pull_requests[0].number)'
        type: number
        required: true
      agent-login:
        description: >
          GitHub login of the developer-agent GitHub App bot (e.g.
          mfrancza-developer-agent[bot]). Used by the filter-agent-pr
          activity to gate the run to agent-authored PRs only.
        type: string
        required: true
      image:
        description: >
          Pre-built agent image reference to pull (e.g.
          ghcr.io/owner/repo/developer:v1). Leave empty (default) to build
          from the local Docker build context instead — the mode used by
          this repository's self-hosted runs.
        type: string
        required: false
        default: ''
    secrets:
      DEVELOPER_APP_ID:
        required: true
      DEVELOPER_APP_PRIVATE_KEY:
        required: true
      # LLM API keys are declared required: false so that callers who use only
      # one provider (e.g. Anthropic only) do not need to set placeholder secrets
      # for the other two. The container entrypoint validates at runtime that the
      # key matching the resolved model is present, so an absent key causes a
      # clear runtime error rather than a silent no-op.
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      XAI_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: read  # for pulls.get in the filter-agent-pr activity

jobs:
  fix-checks:
    # No if: condition here — the caller's job already gates on
    # workflow_run.conclusion == 'failure' and pull_requests[0] != null.
    # Adding those conditions here would incorrectly reference the
    # workflow_call event (which has no workflow_run property).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate job.workflow_sha is populated
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "${JOB_WORKFLOW_SHA}" ]; then
            echo "::error::job.workflow_sha resolved to an empty string. \
The reusable-workflow helper checkout cannot proceed without a resolved SHA. \
See docs/design/helper-checkout-job-workflow-sha-context.md."
            exit 1
          fi
          echo "job.workflow_sha=${JOB_WORKFLOW_SHA}"

      # Check out this repo's own helper actions at the exact SHA the caller
      # pinned to.  job.workflow_sha is GitHub's trust anchor: it
      # resolves the ref the caller used in `uses: …@<ref>` at dispatch time
      # and is not influenceable by the caller's workspace.  Using a dedicated
      # subdirectory (_agentic-workflow/) avoids overwriting the caller's
      # workspace and keeps the helper checkout clearly separate.
      # See docs/design/reusable-workflow-helper-resolution.md Decisions 1, 3, 4.
      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ job.workflow_sha }}
          path: _agentic-workflow
          persist-credentials: false

      # The workflow_run event payload doesn't include the PR author, so look it
      # up and only proceed if the PR was authored by the developer agent.
      # This is the trust gate: we only react to checks failing on the
      # agent's own PRs, never on PRs from other authors.
      - name: Filter to agent-authored PRs
        id: filter
        uses: ./_agentic-workflow/.github/actions/filter-agent-pr
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          pr-number: ${{ inputs.pr-number }}
          agent-login: ${{ inputs.agent-login }}

      # Mint only after the trust gate — no installation token for runs we skip.
      - name: Mint installation token for developer-agent
        if: steps.filter.outputs.proceed == 'true'
        id: setup
        uses: ./_agentic-workflow/.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Resolve linked issue from PR body
        if: steps.filter.outputs.proceed == 'true'
        id: linked-issue
        uses: ./_agentic-workflow/.github/actions/find-linked-issue
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          pr-number: ${{ inputs.pr-number }}

      - name: Resolve Claude model from issue labels
        if: steps.linked-issue.outputs.proceed == 'true'
        id: model
        uses: ./_agentic-workflow/.github/actions/resolve-model
        with:
          token: ${{ steps.setup.outputs.token }}
          subject-type: issue
          subject-number: ${{ steps.linked-issue.outputs.issue_number }}
          repo: ${{ github.repository }}
          default-model: ${{ vars.DEFAULT_MODEL }}
          agent-type: developer

      - name: Prepare agent log directory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agent-logs"
          chmod 0777 "${RUNNER_TEMP}/agent-logs"

      - name: Run agent
        if: steps.filter.outputs.proceed == 'true'
        uses: ./_agentic-workflow/.github/actions/run-agent
        with:
          image: ${{ inputs.image }}
          gh-token: ${{ steps.setup.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          repo: ${{ github.repository }}
          agent-action: fix-checks
          pr-number: ${{ inputs.pr-number }}
          model: ${{ steps.model.outputs.claude_model || vars.DEFAULT_MODEL }}
          logs-dir: ${{ runner.temp }}/agent-logs

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-fix-checks-pr-${{ inputs.pr-number }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs
          retention-days: 30
          if-no-files-found: warn
