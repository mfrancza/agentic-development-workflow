name: agent-fix-checks (reusable)

# Reusable workflow extracted from agent-fix-checks.yml. Event callers supply
# only the trigger fields; this workflow applies the event, conclusion, and
# universal FIX_CHECKS_ALLOW gates, resolves the check to a PR, then acquires
# the per-PR lock only for accepted work. Poll callers retain their already
# resolved PR entry path by omitting event-name.
#
# NOTE on github.event in reusable workflows: within a reusable workflow
# github.event is the workflow_call event payload, not the calling workflow's
# original event. All event data that steps need must therefore be passed
# as explicit inputs: see the with: block in agent-fix-checks.yml.
#
# External consumers: this workflow self-checks out helper actions into
# _agentic-workflow/ before any composite-action step runs. The checkout ref
# is the resolved helpers-ref input (see docs/design/helper-checkout-job-workflow-sha-context.md
# and AGENTS.md § Known traps). No checkout of the caller workspace is performed.

on:
  workflow_call:
    inputs:
      pr-number:
        description: >
          Pull request number for an already-resolved caller such as the poller.
          Event callers omit this and let this workflow resolve the PR.
        type: number
        required: false
        default: 0
      event-name:
        description: >
          Trigger event name for an event-driven caller. Supported values are
          workflow_run and check_run. Omit for an already-resolved poll entry.
        type: string
        required: false
        default: ''
      event-conclusion:
        description: 'Conclusion from the triggering workflow_run or check_run.'
        type: string
        required: false
        default: ''
      head-sha-at-trigger:
        description: >
          Head SHA observed by the caller. The event path resolves it to a PR;
          it is also passed to the container freshness guard as
          GITHUB_HEAD_SHA_AT_TRIGGER.
        type: string
        required: true
      agent-login:
        description: >
          GitHub login of the developer-agent GitHub App bot (e.g.
          mfrancza-developer-agent[bot]). Used by the filter-agent-pr
          activity to gate the run to agent-authored PRs only.
        type: string
        required: true
      image:
        description: >
          Pre-built agent image reference to pull (e.g.
          ghcr.io/owner/repo/developer:v1). Leave empty (default) to build
          from the local Docker build context instead — the mode used by
          this repository's self-hosted runs.
        type: string
        required: false
        default: ''
      helpers-ref:
        description: >
          Git ref (tag, branch, or full commit SHA) of
          mfrancza/agentic-development-workflow to check out for helper
          actions. Must not be empty. Repository-owned callers pass
          github.sha; external callers pass the same ref used in the uses:
          selector (e.g. v0, v0.0.2, or a full SHA).
        required: true
        type: string
    secrets:
      DEVELOPER_APP_ID:
        required: true
      DEVELOPER_APP_PRIVATE_KEY:
        required: true
      # LLM API keys are declared required: false so that callers who use only
      # one provider (e.g. Anthropic only) do not need to set placeholder secrets
      # for the other two. The container entrypoint validates at runtime that the
      # key matching the resolved model is present, so an absent key causes a
      # clear runtime error rather than a silent no-op.
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      XAI_API_KEY:
        required: false

permissions:
  contents: read
  checks: read         # for resolve-check-pr in the event-delivery path
  pull-requests: read  # for pulls.get in the filter-agent-pr activity

jobs:
  resolve-trigger:
    # Keep all event-specific delivery and authorization gates inside the
    # reusable workflow. The resolver makes the definitive malformed/empty
    # allowlist and canonical Checks API name decision.
    if: >
      vars.FIX_CHECKS_ALLOW != '' &&
      (inputs.event-name == 'workflow_run' || inputs.event-name == 'check_run') &&
      (inputs.event-conclusion == 'failure' ||
       inputs.event-conclusion == 'timed_out' ||
       inputs.event-conclusion == 'action_required')
    runs-on: ubuntu-24.04
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi

      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false

      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"

      - name: Resolve failing check to pull request
        id: resolve
        uses: ./_agentic-workflow/.github/actions/resolve-check-pr
        with:
          head-sha: ${{ inputs.head-sha-at-trigger }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          allowed-checks: ${{ vars.FIX_CHECKS_ALLOW }}

  fix-checks:
    needs: resolve-trigger
    # For event callers, the resolver must accept the work before this job can
    # acquire its lock. The poller has already resolved and authorized its PR.
    # always() permits the poll path to continue when resolve-trigger is
    # intentionally skipped because no event-name was supplied.
    if: >
      always() &&
      ((inputs.event-name == '' && inputs.pr-number > 0) ||
       (inputs.event-name != '' && needs.resolve-trigger.outputs.proceed == 'true'))
    # needs outputs are available here, unlike in a workflow-level
    # concurrency declaration. This keeps rejected event deliveries out of
    # the per-PR queue entirely.
    concurrency:
      group: agent-fix-checks-pr-${{ inputs.event-name == '' && inputs.pr-number || needs.resolve-trigger.outputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi

      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false

      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"

      # The workflow_run event payload doesn't include the PR author, so look it
      # up and only proceed if the PR was authored by the developer agent.
      # This is the trust gate: we only react to checks failing on the
      # agent's own PRs, never on PRs from other authors.
      - name: Filter to agent-authored PRs
        id: filter
        uses: ./_agentic-workflow/.github/actions/filter-agent-pr
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          pr-number: ${{ inputs.event-name == '' && inputs.pr-number || needs.resolve-trigger.outputs.pr_number }}
          agent-login: ${{ inputs.agent-login }}

      # Mint only after the trust gate — no installation token for runs we skip.
      - name: Mint installation token for developer-agent
        if: steps.filter.outputs.proceed == 'true'
        id: setup
        uses: ./_agentic-workflow/.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Resolve linked issue from PR body
        if: steps.filter.outputs.proceed == 'true'
        id: linked-issue
        uses: ./_agentic-workflow/.github/actions/find-linked-issue
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          pr-number: ${{ inputs.event-name == '' && inputs.pr-number || needs.resolve-trigger.outputs.pr_number }}

      - name: Resolve Claude model from issue labels
        if: steps.linked-issue.outputs.proceed == 'true'
        id: model
        uses: ./_agentic-workflow/.github/actions/resolve-model
        with:
          token: ${{ steps.setup.outputs.token }}
          subject-type: issue
          subject-number: ${{ steps.linked-issue.outputs.issue_number }}
          repo: ${{ github.repository }}
          default-model: ${{ vars.DEFAULT_MODEL }}
          agent-type: developer

      - name: Prepare agent log directory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agent-logs"
          chmod 0777 "${RUNNER_TEMP}/agent-logs"

      - name: Run agent
        if: steps.filter.outputs.proceed == 'true'
        uses: ./_agentic-workflow/.github/actions/run-agent
        env:
          # Forwarded by run-agent's explicit optional-env allowlist. [] (or
          # an absent policy) remains disabled inside the freshness guard.
          FIX_CHECKS_ALLOW: ${{ vars.FIX_CHECKS_ALLOW }}
          GITHUB_HEAD_SHA_AT_TRIGGER: ${{ inputs.head-sha-at-trigger }}
          # Optional override for the 15-minute stale-replacement wait.
          FIX_CHECKS_WAIT_SECONDS: ${{ vars.FIX_CHECKS_WAIT_SECONDS }}
        with:
          image: ${{ inputs.image }}
          gh-token: ${{ steps.setup.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          repo: ${{ github.repository }}
          agent-action: fix-checks
          pr-number: ${{ inputs.event-name == '' && inputs.pr-number || needs.resolve-trigger.outputs.pr_number }}
          model: ${{ steps.model.outputs.claude_model || vars.DEFAULT_MODEL }}
          logs-dir: ${{ runner.temp }}/agent-logs

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-fix-checks-pr-${{ inputs.event-name == '' && inputs.pr-number || needs.resolve-trigger.outputs.pr_number }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs
          retention-days: 30
          if-no-files-found: warn
