name: agent-respond-review (reusable)

# Reusable workflow extracted from agent-respond-review.yml.
# Callers supply the event triggers and PR-author/self-trigger guard; this
# workflow authorizes the review author before acquiring its concurrency lock.
# It receives the event data as typed inputs plus the token secrets and
# performs all the actual work.
#
# NOTE on github.event in reusable workflows: within a reusable workflow
# github.event is the workflow_call event payload, not the calling workflow's
# original event. All event data that steps need must therefore be passed
# as explicit inputs: see the with: block in agent-respond-review.yml.
#
# External consumers: this workflow self-checks out helper actions into
# _agentic-workflow/ before any composite-action step runs. The checkout ref
# is the resolved helpers-ref input (see docs/design/helper-checkout-job-workflow-sha-context.md
# and AGENTS.md § Known traps). No checkout of the caller workspace is performed.

on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Pull request number (github.event.pull_request.number)'
        type: number
        required: true
      review-state:
        description: 'Review state (github.event.review.state): approved, changes_requested, commented, etc.'
        type: string
        required: true
      review-body:
        description: 'Review body text (github.event.review.body)'
        type: string
        required: false
        default: ''
      review-id:
        description: 'Review ID (github.event.review.id)'
        type: string
        required: true
      repo-name:
        description: 'Repository name without owner prefix (github.event.repository.name)'
        type: string
        required: true
      review-author:
        description: 'GitHub login of the review author (github.event.review.user.login)'
        type: string
        required: true
      pr-author:
        description: 'GitHub login of the PR author (github.event.pull_request.user.login)'
        type: string
        required: true
      head-sha:
        description: >
          Current PR head SHA (github.event.pull_request.head.sha). When empty,
          the stale-SHA guard inside check-reviewer-feedback is skipped
          (fail-open).
        type: string
        required: false
        default: ''
      review-commit-id:
        description: >
          The commit SHA the review was submitted against
          (github.event.review.commit_id). When empty, the stale-SHA guard
          falls through (does not skip on a missing value).
        type: string
        required: false
        default: ''
      image:
        description: >
          Pre-built agent image reference to pull (e.g.
          ghcr.io/owner/repo/developer:v1). Leave empty (default) to build
          from the local Docker build context instead — the mode used by
          this repository's self-hosted runs.
        type: string
        required: false
        default: ''
      helpers-ref:
        description: >
          Git ref (tag, branch, or full commit SHA) of
          mfrancza/agentic-development-workflow to check out for helper
          actions. Must not be empty. Repository-owned callers pass
          github.sha; external callers pass the same ref used in the uses:
          selector (e.g. v0, v0.0.2, or a full SHA).
        required: true
        type: string
    secrets:
      DEVELOPER_APP_ID:
        required: true
      DEVELOPER_APP_PRIVATE_KEY:
        required: true
      # LLM API keys are declared required: false so that callers who use only
      # one provider (e.g. Anthropic only) do not need to set placeholder secrets
      # for the other two. The container entrypoint validates at runtime that the
      # key matching the resolved model is present, so an absent key causes a
      # clear runtime error rather than a silent no-op.
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      XAI_API_KEY:
        required: false
      ALLOWLIST_RESOLVER_APP_ID: { required: false }
      ALLOWLIST_RESOLVER_APP_PRIVATE_KEY: { required: false }

permissions:
  contents: read
  pull-requests: read   # for check-reviewer-feedback activity (review threads + inline comments)

jobs:
  feedback-gate:
    # Decide whether a response is required before acquiring the per-PR lock
    # or minting either resolver or developer-agent installation tokens.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.feedback.outputs.proceed }}
    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi
      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false
      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"
      - name: Check for reviewer feedback
        id: feedback
        uses: ./_agentic-workflow/.github/actions/check-reviewer-feedback
        with:
          token: ${{ github.token }}
          review-state: ${{ inputs.review-state }}
          review-body: ${{ inputs.review-body }}
          review-id: ${{ inputs.review-id }}
          pr-number: ${{ inputs.pr-number }}
          repo-owner: ${{ github.repository_owner }}
          repo-name: ${{ inputs.repo-name }}
          review-author: ${{ inputs.review-author }}
          pr-author: ${{ inputs.pr-author }}
          head-sha: ${{ inputs.head-sha }}
          review-commit-id: ${{ inputs.review-commit-id }}

  authorize:
    needs: feedback-gate
    if: needs.feedback-gate.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi
      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false
      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"
      - name: Detect team references
        id: detect
        env:
          ALLOWLIST: ${{ vars.AGENT_ALLOWLIST }}
        run: |
          set -euo pipefail
          has=false
          if [[ -n "$ALLOWLIST" ]] && jq -e 'any(.[]; type == "string" and contains("/"))' <<< "$ALLOWLIST" >/dev/null; then
            has=true
          fi
          echo "allowlist_has_team=$has" >> "$GITHUB_OUTPUT"; echo "needs_resolver=$has" >> "$GITHUB_OUTPUT"
      - name: Mint installation token for allowlist resolver
        id: allowlist-resolver
        if: steps.detect.outputs.needs_resolver == 'true'
        continue-on-error: true
        uses: ./_agentic-workflow/.github/actions/agent-token
        with:
          client-id: ${{ secrets.ALLOWLIST_RESOLVER_APP_ID }}
          private-key: ${{ secrets.ALLOWLIST_RESOLVER_APP_PRIVATE_KEY }}
      - name: Check agent allowlist
        uses: ./_agentic-workflow/.github/actions/check-agent-allowlist
        with:
          allowlist: ${{ vars.AGENT_ALLOWLIST }}
          principal: ${{ inputs.review-author }}
          additional-trusted-logins: '["mfrancza-reviewer-agent[bot]","Copilot","copilot-pull-request-reviewer[bot]","github-copilot[bot]"]'
          resolver-token: ${{ steps.allowlist-resolver.outputs.token }}
  respond-review:
    needs: [feedback-gate, authorize]
    concurrency:
      group: agent-respond-review-pr-${{ inputs.pr-number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate helpers-ref input
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HELPERS_REF}" ]]; then
            echo "::error::helpers-ref input is required and must not be empty."
            exit 1
          fi

      - name: Resolve helpers-ref to commit SHA
        id: resolve-ref
        env:
          HELPERS_REF: ${{ inputs.helpers-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/mfrancza/agentic-development-workflow/commits/${HELPERS_REF}" --jq '.sha')"
          if [[ -z "${resolved}" ]]; then
            echo "::error::helpers-ref '${HELPERS_REF}' did not resolve to a commit SHA."
            exit 1
          fi
          echo "Resolved ${HELPERS_REF} → ${resolved}"
          echo "sha=$(printf '%s' "${resolved}" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Check out upstream helper actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mfrancza/agentic-development-workflow
          ref: ${{ steps.resolve-ref.outputs.sha }}
          path: _agentic-workflow
          persist-credentials: false

      - name: Verify helper checkout HEAD matches resolved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C _agentic-workflow rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Helper checkout HEAD (${actual_sha}) does not match the resolved SHA (${EXPECTED_SHA}). Aborting before any helper action runs."
            exit 1
          fi
          echo "Helper checkout HEAD verified: ${actual_sha}"

      - name: Mint installation token for developer-agent
        id: setup
        uses: ./_agentic-workflow/.github/actions/agent-token
        with:
          client-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}

      - name: Resolve linked issue from PR body
        id: linked-issue
        uses: ./_agentic-workflow/.github/actions/find-linked-issue
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          pr-number: ${{ inputs.pr-number }}

      - name: Resolve Claude model from issue labels
        if: steps.linked-issue.outputs.proceed == 'true'
        id: model
        uses: ./_agentic-workflow/.github/actions/resolve-model
        with:
          token: ${{ steps.setup.outputs.token }}
          subject-type: issue
          subject-number: ${{ steps.linked-issue.outputs.issue_number }}
          repo: ${{ github.repository }}
          default-model: ${{ vars.DEFAULT_MODEL }}
          agent-type: developer

      - name: Prepare agent log directory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agent-logs"
          chmod 0777 "${RUNNER_TEMP}/agent-logs"

      - name: Run agent
        uses: ./_agentic-workflow/.github/actions/run-agent
        with:
          image: ${{ inputs.image }}
          gh-token: ${{ steps.setup.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          repo: ${{ github.repository }}
          agent-action: respond-review
          pr-number: ${{ inputs.pr-number }}
          model: ${{ steps.model.outputs.claude_model || vars.DEFAULT_MODEL }}
          logs-dir: ${{ runner.temp }}/agent-logs

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-respond-review-pr-${{ inputs.pr-number }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-logs
          retention-days: 30
          if-no-files-found: warn
