name: require-two-developer-approvals-reconcile

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write

concurrency:
  group: require-two-developer-approvals-reconcile
  cancel-in-progress: false

jobs:
  find-open-prs:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.interval.outputs.run }}
      prs: ${{ steps.prs.outputs.value }}
    steps:
      - id: interval
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ vars.ENABLE_PROTECTED_APPROVAL_GATE_RECONCILE_MINUTES }}
        run: |
          set -euo pipefail
          minutes="${MINUTES:-10}"
          if ! [[ "$minutes" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::ENABLE_PROTECTED_APPROVAL_GATE_RECONCILE_MINUTES must be a positive integer."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            if completed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/require-two-developer-approvals-reconcile.yml/runs?status=success&per_page=10" 2>/dev/null)"; then
              previous="$(jq -r --arg id "$GITHUB_RUN_ID" '[.workflow_runs[] | select((.id | tostring) != $id) | .updated_at] | max // empty' <<<"$completed")"
              if [[ -n "$previous" ]] && (( $(date +%s) - $(date -d "$previous" +%s) < minutes * 60 )); then
                echo 'run=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo '::warning::Could not read prior reconciliation runs; continuing with a full sweep.'
            fi
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
      - id: prs
        if: steps.interval.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,headRefOid | jq -c 'unique_by(.headRefOid) | map({number, sha: .headRefOid})')"
          echo "value=${prs}" >> "$GITHUB_OUTPUT"
  publish:
    needs: find-open-prs
    if: needs.find-open-prs.outputs.run == 'true' && needs.find-open-prs.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.find-open-prs.outputs.prs) }}
    concurrency:
      group: require-two-developer-approvals-sha-${{ matrix.pr.sha }}
      cancel-in-progress: false
    uses: ./.github/workflows/require-two-developer-approvals-reusable.yml
    with:
      protected-pr-author-logins: ${{ vars.PROTECTED_PR_AUTHOR_LOGINS }}
      required-approval-count: ${{ vars.REQUIRED_APPROVAL_COUNT }}
      enabled: ${{ vars.ENABLE_PROTECTED_APPROVAL_GATE }}
      pr-number: ${{ matrix.pr.number }}
      head-sha: ${{ matrix.pr.sha }}
      repo: ${{ github.repository }}
      helpers-ref: ${{ github.sha }}
