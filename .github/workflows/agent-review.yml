name: agent-review

on:
  # pull_request_target (not pull_request) is intentional: GitHub always
  # resolves the workflow YAML and the build context for docker/reviewer from
  # the *base* branch, never from the PR head. This prevents an allowlisted
  # user applying agent:review from triggering a run that executes PR-authored
  # workflow code or a PR-authored Docker image with access to
  # REVIEWER_APP_PRIVATE_KEY and ANTHROPIC_API_KEY.
  pull_request_target:
    types: [labeled, synchronize]

# Deny-all at the workflow level; the write scopes the resolve step needs are
# granted on the review job itself so any future job added to this workflow
# starts with no permissions.
permissions: {}

concurrency:
  group: agent-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Gate differently per event type:
    #
    # Trust model — fork-headed PRs are excluded entirely on both event paths.
    #   Even though only trusted base-branch code runs (default checkout on
    #   pull_request_target = GITHUB_SHA, the current base tip), the
    #   attacker-controlled diff still reaches Claude on every push, so the
    #   secrets exposure window is real. Both event types require
    #   github.event.pull_request.head.repo.full_name == github.repository to
    #   enforce this. Fork contributors may still
    #   request a review by asking a repo member to cherry-pick / create a
    #   same-repo branch from the fork's changes, open a new PR from that
    #   branch in the base repo, and then apply the agent:review label to that
    #   same-repo PR.
    #
    # labeled — keep the existing sender-allowlist check: the user who applied
    #   the label must be in vars.AGENT_ALLOWLIST. GitHub has no per-label
    #   permission model and `repository_owner` doesn't work in org repos (it's
    #   the org login, not a user). The allowlist is managed as a Terraform
    #   parameter so usernames are not hardcoded in YAML.
    #
    # synchronize — check only that agent:review is already on the PR and that
    #   the head repo matches the base repo (same-repo push); no sender check.
    #   The sender on synchronize is the pusher, not the actor who applied the
    #   label. The label is the authorization artifact: it was applied earlier
    #   by an allowlisted actor, so its presence is sufficient to authorize
    #   re-review for same-repo pushes. Fork-headed PRs are rejected here to
    #   prevent an attacker-controlled push from triggering the reviewer with
    #   secrets in scope on every push. See docs/design/re-review-loop.md § 1.
    if: >
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'labeled' &&
         github.event.label.name == 'agent:review' &&
         contains(fromJSON(vars.AGENT_ALLOWLIST), github.event.sender.login)) ||
        (github.event.action == 'synchronize' &&
         contains(github.event.pull_request.labels.*.name, 'agent:review'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # contents: write + pull-requests: write are for the "Resolve addressed
    # review threads" step only. The resolveReviewThread GraphQL mutation
    # requires a token with Contents: write
    # (github.com/orgs/community/discussions/44650), and the reviewer app token
    # is deliberately Contents: read-only — the no-push guarantee in
    # docs/design/reviewer-container.md decision 3 — so the container records
    # addressed thread IDs to a mounted file and this job's GITHUB_TOKEN
    # resolves them afterwards. GITHUB_TOKEN never enters the container; only
    # trusted base-branch workflow code runs in job steps (pull_request_target
    # + default checkout of GITHUB_SHA (current base tip) with
    # persist-credentials: false), so
    # the write scope is not exposed to PR-authored code.
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Checkout must precede the local agent-token action: the runner resolves
      # ./.github/actions/* references from the workspace.
      # No explicit ref: on pull_request_target the default checkout is
      # GITHUB_SHA = the latest commit on the base branch, so the local
      # actions, .github/scripts activities, and the docker/reviewer build
      # context are always loaded from trusted, *current* base-branch code —
      # never from the PR head. Do NOT pin to
      # github.event.pull_request.base.sha instead: GitHub freezes that value
      # at the base tip as of the PR's last head push, so after any merge to
      # main every review of an un-rebased PR would execute stale workspace
      # code (hit live when the #253 composite-action fix merged and
      # re-reviews of open PRs kept running the broken pre-fix resolve-model).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Mint installation token for reviewer-agent
        id: setup
        uses: ./.github/actions/agent-token
        with:
          client-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      - name: Resolve Claude model from PR labels
        id: model
        uses: ./.github/actions/resolve-model
        with:
          token: ${{ steps.setup.outputs.token }}
          subject-type: pr
          subject-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          default-model: ${{ vars.DEFAULT_MODEL }}

      - name: Build reviewer image
        run: docker build -t agent-reviewer:ci ./docker/reviewer

      - name: Run reviewer agent
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          AGENT_MODEL: ${{ steps.model.outputs.claude_model }}
        run: |
          # The container records the GraphQL IDs of addressed review threads
          # into this mounted directory; the resolve step below reads them.
          # chmod 777 because the container's non-root `agent` user does not
          # necessarily share the runner's uid.
          mkdir -p "$RUNNER_TEMP/reviewer-output"
          chmod 777 "$RUNNER_TEMP/reviewer-output"
          docker run --rm \
            -e GH_TOKEN \
            -e ANTHROPIC_API_KEY \
            -e OPENAI_API_KEY \
            -e GITHUB_REPO \
            -e GITHUB_PR_NUMBER \
            -e AGENT_MODEL \
            -e RESOLVE_THREADS_FILE=/agent-output/resolve-threads.txt \
            -v "$RUNNER_TEMP/reviewer-output:/agent-output" \
            agent-reviewer:ci

      - name: Resolve addressed review threads
        # Runs with the workflow GITHUB_TOKEN (see the permissions comment at
        # the top of this file), not the reviewer app token — so threads show
        # as resolved by github-actions[bot]. The recorded IDs are
        # agent-generated output derived from PR content, so they are treated
        # as untrusted: each ID is format-checked and intersected against the
        # PR's actual open threads before the mutation is issued.
        uses: ./.github/actions/resolve-review-threads
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          resolve-file: ${{ runner.temp }}/reviewer-output/resolve-threads.txt
